contract = 1
id = "hello-example"

[config.defaults]
backend_port = 18900

# install.sh renders the nginx fragment with sed. Unlike python3/systemctl/curl,
# sed is not a platform-core prerequisite, so this package must put it in the
# preflight receipt before its lifecycle script may use it.
[[prerequisites]]
command = "sed"
predicate = "present"
expected = "-"
fix = "sudo apt-get update && sudo apt-get install -y sed"
note = "Nginx fragment rendering"

# The service is a user unit. The nginx fragment is included inside Airlock's
# already-gated hub server, so the backend only listens on loopback.
[artifacts]
units = ["airlock-hello-example.service"]
fragments = ["hub-locations.d/hello-example.conf"]
