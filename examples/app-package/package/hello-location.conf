# Included inside the hub server, whose server-level gate has already accepted
# the authenticated caller. Keep this backend loopback-only; this fragment is
# the public route, not a second public listener.
location = /hello-example { return 308 /hello-example/; }

location /hello-example/ {
    proxy_pass http://127.0.0.1:@BACKEND_PORT@/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
}
