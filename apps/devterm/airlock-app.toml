contract = 1
id = "devterm"

# Transcribed from the former APP_DEFAULTS["devterm"] entry.
# D-DEVTERM-9900 retired public_port/redirect_port. HTTPS only.
[config.defaults]
https_port = 19910
# Optional compatibility ingress for consumers that retain a legacy port.
# Keep it disabled unless this box explicitly owns that listener.
compat_https = 8443
compat_https_enabled = false
gate_port = 19911
ttyd_port = 19912
backend_port = 19913
font_size = 15
lang = "C.UTF-8"
accounts = false
xai = false
remote_hosts = ""
# Retired account inputs remain schema-valid during the platform rollout, but devterm's
# installer deliberately ignores them. They cannot use [config.deprecated]:
# airlock-config requires `replacement` to name a different scalar key in this package,
# and no honest app-local replacement exists.
claude_switch = ""
claude_status = ""
fleet_store = ""
fleet_store_url = ""
# Fleet read-open. Empty (the default) means the gate is owner-only end to end.
# Set to a domain ("example.com") to let any identity in that domain read the four
# account-state routes (/claude-status, /claude-usage, /claude-usage-store,
# /codex-usage) so a central console can poll this box. Login state is not a secret
# here: those routes emit no token and no hash. Nothing that writes is opened.
fleet_read_domain = ""
orca_shim = ""

# Transcribed from install/prerequisites.tsv's seven devterm rows (F11).
[[prerequisites]]
command = "tmux"
predicate = "present"
expected = "-"
fix = "sudo apt-get update && sudo apt-get install -y tmux"
note = "Session runtime"

[[prerequisites]]
command = "python3"
predicate = "major-gte"
expected = "3.11"
fix = "sudo apt-get update && sudo apt-get install -y python3"
note = "Gate runtime"

[[prerequisites]]
command = "curl"
predicate = "present"
expected = "-"
fix = "sudo apt-get update && sudo apt-get install -y curl"
note = "Release download"

[[prerequisites]]
command = "sha256sum"
predicate = "present"
expected = "-"
fix = "sudo apt-get update && sudo apt-get install -y coreutils"
note = "Release verification"

[[prerequisites]]
command = "systemctl"
predicate = "present"
expected = "-"
fix = "sudo apt-get update && sudo apt-get install -y systemd"
note = "User services"

[[prerequisites]]
command = "tailscale"
predicate = "present"
expected = "-"
fix = "sudo apt-get install -y curl && curl -fsSL https://tailscale.com/install.sh | sh"
note = "Private ingress"

[[prerequisites]]
command = "sudo"
predicate = "present"
expected = "-"
fix = "su -c 'apt-get update && apt-get install -y sudo'"
note = "Privileged ingress setup"

# Appendix: two user units, one servers.d fragment, ttyd + the devterm shell wrapper +
# two unconditional account-tool compatibility shims. Both stay declared because D6
# record-diff would otherwise delete the terminal paths on upgrade. The real account
# tools are platform binaries; the shims bake their resolved absolute paths at install
# time and retired account flags do not affect them. The web client's staged share dir
# follows. Deliberately NOT declared
# (retained operator data): ~/.config/airlock-devterm/tabs.json (user tabs).
# serve_ports/[serve.https]: HTTPS only. D-DEVTERM-9900 retired the
# plaintext 9900 mapping (board 0ff93d05). Live close is a later step.
[artifacts]
units = ["airlock-devterm.service", "airlock-devterm-gate.service"]
fragments = ["servers.d/devterm.conf"]
files = ["~/.local/bin/ttyd", "~/.local/bin/devterm-shell",
         "~/.local/bin/claude-switch", "~/.local/bin/claude-status",
         "~/.local/share/airlock-devterm/"]
serve_ports = ["https_port", "compat_https"]

[serve.https]
https_port = "gate_port"
compat_https = { target = "gate_port", enabled = "compat_https_enabled" }

# From hub/index.html's APPS table (devterm row).
[tile]
label = "DevTerm"
sub = "web shell"
cat = "coding"
glyph = "app-devterm"

[audience]
supported = ["owner"]
default = "owner"
