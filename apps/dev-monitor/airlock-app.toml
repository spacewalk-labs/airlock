contract = 1
id = "dev-monitor"

# Transcribed from the former APP_DEFAULTS["dev-monitor"] entry.
[config]
# Measured by the installer from the box's own FQDN (install.sh:64-83). Declaring
# it as config would create a knob that does nothing, because the installer
# overwrites whatever it was set to.
runtime_env = [
  "AIRLOCK_DEV_MONITOR_ACCOUNTS_STATUS_BIN",
  "AIRLOCK_DEV_MONITOR_CORS_ORIGINS",
  "AIRLOCK_DEV_MONITOR_SLACK_WEBHOOK_URGENT",
]

[config.defaults]
backend_port = 19923
messages = false
# The single urgent webhook selector; values are names, never credentials.
slack_webhook_urgent_env = ""
exec_cwd_root = ""
exec_session = "devmon-exec"
# Untrusted spool producers run under this system identity. The installer resolves the
# name to the box-assigned UID when loading nftables; no numeric UID is portable or safe
# to pin in configuration.
spool_writer_user = "airlock-dev-monitor-writer"
spool_writer_group = "airlock-dev-monitor-writers"
# Credential freshness. Off by default: the check reads files under the operator's home
# that belong to other tools, so looking at them at all is an opt-in. On, the dashboard
# grows a card and /api/tokens answers; the periodic half is a separate explicit act
# (apps/dev-monitor/install-token-timer.sh), because a standing timer is not something a
# config default should switch on.
token_freshness = false
# Claude: warn once the refresh-token deadline is this close.
token_freshness_warn_hours = 24
# Codex: warn once tokens.last_refresh is this old. There is no expiry field to read, so
# age is the only evidence the session is still alive.
token_freshness_stale_hours = 24
# Optional company catalog. Empty is the public/default posture: the owner API returns an
# empty company list with 200. Private fleet configuration supplies the Git repository;
# the long-lived backend reads these values through the already-pinned AIRLOCK_CONFIG.
company_catalog_repository = ""
company_catalog_ref = "main"
company_catalog_stage = ""

# Installer and smoke command prerequisites.
[[prerequisites]]
command = "python3"
predicate = "major-gte"
expected = "3.11"
fix = "sudo apt-get update && sudo apt-get install -y python3"
note = "Application runtime"

[[prerequisites]]
command = "systemctl"
predicate = "present"
expected = "-"
fix = "sudo apt-get update && sudo apt-get install -y systemd"
note = "User service"

[[prerequisites]]
command = "journalctl"
predicate = "present"
expected = "-"
fix = "sudo apt-get update && sudo apt-get install -y systemd"
note = "Log viewer"

[[prerequisites]]
command = "realpath"
predicate = "present"
expected = "-"
fix = "sudo apt-get update && sudo apt-get install -y coreutils"
note = "Compatibility path normalization"

[[prerequisites]]
command = "timeout"
predicate = "present"
expected = "-"
fix = "sudo apt-get update && sudo apt-get install -y coreutils"
note = "Bounded heartbeat shutdown and state queries"

[[prerequisites]]
command = "curl"
predicate = "present"
expected = "-"
fix = "sudo apt-get update && sudo apt-get install -y curl"
note = "Smoke check"

[[prerequisites]]
command = "getent"
predicate = "present"
expected = "-"
fix = "sudo apt-get update && sudo apt-get install -y libc-bin"
note = "Writer identity lookup"

[[prerequisites]]
command = "groupadd"
predicate = "present"
expected = "-"
fix = "sudo apt-get update && sudo apt-get install -y passwd"
note = "Writer group provisioning"

[[prerequisites]]
command = "nft"
predicate = "present"
expected = "-"
fix = "sudo apt-get update && sudo apt-get install -y nftables"
note = "Writer egress firewall"

[[prerequisites]]
command = "sudo"
predicate = "present"
expected = "-"
fix = "su -c 'apt-get update && apt-get install -y sudo'"
note = "Writer boundary provisioning"

[[prerequisites]]
command = "setpriv"
predicate = "present"
expected = "-"
fix = "sudo apt-get update && sudo apt-get install -y util-linux"
note = "Writer privilege verification"

[[prerequisites]]
command = "useradd"
predicate = "present"
expected = "-"
fix = "sudo apt-get update && sudo apt-get install -y passwd"
note = "Writer account provisioning"

# Appendix: one user unit, one hub-locations fragment, the dashboard webroot
# page, and the env file the unit's EnvironmentFile= line reads. The spool
# (~/.local/state/airlock/dev-monitor/) is retained operator data — never
# declared. backend_port is proxied by the hub's own nginx, never
# tailscale-served directly, so it is NOT a serve_ports entry.
[artifacts]
# Stop the activation source before its oneshot and the collecting backend.
# The platform ledger owns stop/verify/delete, including older recorded order.
units = ["airlock-devmon-heartbeat.timer", "airlock-devmon-heartbeat.service",
         "airlock-dev-monitor.service",
         { name = "airlock-dev-monitor-spool-firewall.service", scope = "system" }]
fragments = ["hub-locations.d/dev-monitor.conf"]
webroot = ["monitor/index.html"]
files = ["~/.config/airlock/dev-monitor.env"]
rooted = ["/etc/airlock/dev-monitor-spool.nft",
          "/opt/airlock/libexec/airlock-dev-monitor-spool-firewall"]

# From hub/index.html's APPS table (dev-monitor row).
[tile]
label = "Dev Monitor"
sub = "system status"
cat = "system"
path = "/monitor/"
glyph = "app-monitor"

# D7. Shared covers the observation surface only. The message/action console is
# owner-scoped in the backend itself (devmon_owner.py checks the ingress-injected
# identity AND an nginx-only proxy secret), so widening the tile does not widen
# the console — see SECURITY.md, "who can read the console".
[audience]
supported = ["shared", "owner"]
default = "shared"
