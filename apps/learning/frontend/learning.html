  function sheetCopy(kind, count) {
    if (kind === "archive") return {
      title: count + "개를 보관함으로 옮깁니다",
      message: "공유 링크 " + count + "개를 회수하고 리스트에서 뺍니다. 레포 파일은 그대로 둡니다.",
      confirm: "회수하고 보관",
      danger: true
    };
    if (kind === "publish") return { title: "이 자료를 발행합니다", message: "공유 링크를 만듭니다. 목록에서의 자리는 그대로입니다.", confirm: "발행", danger: false };
    if (kind === "unpublish") return { title: "이 자료의 공유 링크를 회수합니다", message: "레포 파일은 그대로 두고 발행 상태만 바꿉니다.", confirm: "회수", danger: true };
    if (kind === "restore") return { title: "보관을 해제합니다", message: "자료를 보관함에서 빼 목록으로 되돌립니다. 공유 링크는 자동으로 복구하지 않습니다.", confirm: "복원", danger: false };
    return { title: "보관 기록을 삭제합니다", message: "레포 파일과 공유 링크는 건드리지 않고 보관 기록만 삭제합니다.", confirm: "기록 삭제", danger: true };
  }

  function openSheet(kind, paths) {
    var validPaths = paths.filter(function (path) { return safeRepoPath(path); });
    if (!validPaths.length || mutationsLocked()) return;
    state.sheet = { kind: kind, paths: validPaths };
    render();
    window.setTimeout(function () {
      var confirmButton = root.querySelector("[data-sheet-confirm]");
      if (confirmButton) confirmButton.focus();
    }, 0);
  }

  function makeSheet() {

    var backdrop = el("div", "sheet-backdrop");
    backdrop.setAttribute("role", "presentation");

    });
    var dialog = el("div", "action-sheet");

    heading.appendChild(headingTitle);

    ] : [

      "입력     : " + stringValue(plan.url, "확인 불가"),

    ]).join("\n");

  function actionErrorFrom(payload, status) {
    var object = objectValue(payload) || {};
    var error = makeError(object, "작업이 실패했습니다", status);
    if (object.command === undefined) error.command = "POST API";
    if (object.results && Array.isArray(object.results)) {
      var failed = object.results.filter(function (result) { return objectValue(result) && result.ok === false; });
      if (failed.length) error.stderr = failed.map(function (result) { return jsonText(result); }).join("\n");
    }
    return error;
  }

  function performAction(kind, paths) {
    if (mutationsLocked()) return;
    var endpoint = kind;
    var body;
    if (kind === "archive") body = { paths: paths };
    else body = { path: paths[0] };
    state.sheet = null;
    state.actionBusy = true;
    state.actionError = null;
    render();
    window.fetch(apiUrl(endpoint), {
      method: "POST",
      cache: "no-store",
      headers: { "Content-Type": "application/json", Accept: "application/json" },
      body: JSON.stringify(body)
    }).then(function (response) {
      return readResponse(response).then(function (payload) {
        if (!response.ok || (objectValue(payload) && payload.ok === false)) {
          throw actionErrorFrom(payload, response.status);
        }
        if (objectValue(payload) && Array.isArray(payload.results)) {
          var failures = payload.results.filter(function (result) { return objectValue(result) && result.ok === false; });
          if (failures.length) throw actionErrorFrom(payload, response.status);
        }
        return payload;
      });
    }).then(function () {
      state.editing = false;
      state.selected.clear();
      showToast(actionSuccess(kind));
      loadData(false);
    }).catch(function (error) {
      state.actionError = error && error.message ? error : makeError({}, "작업이 실패했습니다", null);
      showToast(state.actionError.message, true);
    }).finally(function () {
      state.actionBusy = false;
      render();
    });
  }

  function setStarValue(path, starred) {
    var groups = [state.items, state.archive.archived];
    groups.forEach(function (entries) {
      entries.forEach(function (entry) {
        if (pathOf(entry) === path) entry.starred = starred;
      });
    });
  }

  function requestStar(item, desired) {
    var path = pathOf(item);
    if (!safeRepoPath(path) || mutationsLocked()) return;
    var mutation = starMutations.get(path);
    if (!mutation) {
      mutation = { confirmed: item.starred === true, desired: desired === true, running: false };
      starMutations.set(path, mutation);
    } else {
      mutation.desired = desired === true;
    }
    state.starError = null;
    setStarValue(path, mutation.desired);
    render();
    flushStar(path);
  }

  function flushStar(path) {
    var mutation = starMutations.get(path);
    if (!mutation || mutation.running) return;
    mutation.running = true;
    var requested = mutation.desired;
    window.fetch(apiUrl("star"), {
      method: "POST",
      cache: "no-store",
      headers: { "Content-Type": "application/json", Accept: "application/json" },
      body: JSON.stringify({ path: path, starred: requested })
    }).then(function (response) {
      return readResponse(response).then(function (payload) {
        if (!response.ok || !objectValue(payload) || payload.ok !== true) {
          throw actionErrorFrom(payload, response.status);
        }
        if (payload.path !== path || typeof payload.starred !== "boolean" || payload.starred !== requested) {
          throw makeError({}, "별표 응답이 요청과 일치하지 않습니다", response.status);
        }
        return payload;
      });
    }).then(function () {
      var current = starMutations.get(path);
      if (!current) return;
      current.confirmed = requested;
      current.running = false;
      if (current.desired !== requested) {
        flushStar(path);
        return;
      }
      starMutations.delete(path);
      confirmedStarOverlays.set(path, { starred: requested, afterLoadNumber: state.loadNumber });
      setStarValue(path, requested);
      syncCurrentListHistory();
      render();
    }).catch(function (error) {
      var current = starMutations.get(path);
      if (!current) return;
      setStarValue(path, current.confirmed);
      starMutations.delete(path);
      state.starError = error && error.message ? error : makeError({}, "별표를 저장하지 못했습니다", null);
      showToast(state.starError.message, true);
      syncCurrentListHistory();
      render();
    });
  }

  /* 🔴 토스트는 **반드시 스스로 사라진다.** 예전에는 타이머가 `performAction` 안에만 있어서
     적재 관련 토스트 3개(큐 등록·취소·기록 삭제)는 화면에 계속 남았다 — 다음 화면까지 따라와
     방금 한 일인지 옛일인지 구분이 안 됐다(실측 2026-07-31 사용자 보고).
     만드는 길을 이 함수 하나로 모아, 타이머 없는 토스트가 생길 수 없게 한다.

     성공은 1초 — 확인만 하면 되는 알림이다. 오류는 6초: "복사가 막혔습니다 — <주소>" 는
     주소를 손으로 복사하는 **유일한 수단**이라 1초면 읽을 수 없다. */
  var TOAST_MS = { success: 1000, error: 6000 };
  var toastTimer = null;

  function showToast(message, isError) {
    state.toast = { message: message, error: !!isError };
    if (toastTimer) window.clearTimeout(toastTimer);
    toastTimer = window.setTimeout(function () {
      toastTimer = null;
      state.toast = null;
      render();
    }, isError ? TOAST_MS.error : TOAST_MS.success);
  }

  function actionSuccess(kind) {
    if (kind === "archive") return "보관함으로 옮겼습니다";
    if (kind === "publish") return "발행했습니다";
    if (kind === "unpublish") return "공유 링크를 회수했습니다";
    if (kind === "restore") return "보관을 해제했습니다";
    return "보관 기록을 삭제했습니다";
  }

  /* 문서를 앱 안에서 띄운다. 브라우저 히스토리에 한 칸 넣어 기기 뒤로가기(스와이프·Alt+←)도
     같은 동작이 되게 한다 — 뒤로가기 버튼과 기기 뒤로가기가 갈라지면 그게 더 헷갈린다. */
  function openDoc(item) {
    if (learningView() !== "list") return;
    var src = docHref(item);
    if (!src) return;
    var viewer = { src: src, title: titleOf(item), external: publicHref(item) };
    pushSubview("viewer", { learningViewer: viewer });
    state.archiveView = false;
    state.viewer = viewer;
    render();
  }

  function closeDoc() {
    if (!state.viewer) return;
    returnToList();
  }

  window.addEventListener("popstate", function (event) {
    renderHistoryDestination(event.state);
  });

  /* 문서 주소를 클립보드로. `navigator.clipboard` 는 보안 컨텍스트(https·localhost)에서만 있고
     테일넷 http 로 열면 없다 — 그때는 execCommand 로 내려가고, 그것도 안 되면 주소를 토스트로
     띄워 손으로 복사할 수 있게 한다(조용히 실패 금지). */
  function copyLink(url) {
    function done(ok) {
      if (ok) showToast("주소를 복사했습니다");
      else showToast("복사가 막혔습니다 — " + url, true);
      render();
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(url).then(function () { done(true); }, function () { done(fallbackCopy(url)); });
      return;
    }
    done(fallbackCopy(url));
  }

  function fallbackCopy(text) {
    var area = document.createElement("textarea");
    area.value = text;
    area.setAttribute("readonly", "readonly");
    area.style.cssText = "position:fixed;top:-1000px;left:0;opacity:0";
    document.body.appendChild(area);
    area.select();
    var ok = false;
    try { ok = document.execCommand("copy"); } catch (error) { ok = false; }
    document.body.removeChild(area);
    return ok;
  }

  /* 🔴 뷰어는 `root` **밖**에 산다. `render()` 가 `root` 를 통째로 비우기 때문에, 뷰어가 그 안에
     있으면 폴링이 돌 때마다 `<iframe>` 이 DOM 에서 떨어졌다 붙는다 — 브라우저는 그때마다
     문서를 **처음부터 다시 로드한다**. 사용자에게는 문서가 깜빡이고 안 보이는 것으로 보였다
     (실측 2026-07-31: 적재가 도는 동안 자료를 열면 계속 리로드). 그래서 뷰어는 자기 호스트를
     갖고, **`src` 가 바뀔 때만** 다시 만든다. `.viewer` 는 `position: fixed; inset: 0` 이라
     `root` 밖으로 나가도 화면 위치가 같다. */
  var viewerHost = document.createElement("div");
  document.body.appendChild(viewerHost);
  var viewerSrc = null;

  function syncViewer() {
    var next = state.viewer ? state.viewer.src : null;
    if (next === viewerSrc) return;
    viewerSrc = next;
    viewerHost.textContent = "";
    var view = makeViewer();
    if (view) viewerHost.appendChild(view);
  }

  function makeViewer() {
    if (!state.viewer) return null;
    var wrap = el("div", "viewer");
    wrap.setAttribute("role", "dialog");
    wrap.setAttribute("aria-label", state.viewer.title || "문서");
    var bar = el("div", "viewer-bar");
    var back = el("button", "viewer-back");
    back.type = "button";
    back.appendChild(icon("back", 18));
    back.appendChild(el("span", "", "목록"));
    back.addEventListener("click", closeDoc);
    bar.appendChild(back);
    bar.appendChild(el("span", "viewer-title", state.viewer.title || "문서"));
    if (state.viewer.external) {
      var copy = el("button", "viewer-copy");
      copy.type = "button";
      copy.title = "이 문서 주소 복사";
      copy.setAttribute("aria-label", "이 문서 주소 복사");
      copy.appendChild(icon("copy", 17));
      copy.addEventListener("click", function () { copyLink(state.viewer.external); });
      bar.appendChild(copy);
    }
    wrap.appendChild(bar);
    var frame = el("iframe", "viewer-frame");
    frame.src = state.viewer.src;
    frame.title = state.viewer.title || "문서";
    wrap.appendChild(frame);
    return wrap;
  }

  /* 🔴 적재가 도는 동안 폴링이 `render()` 를 부르는데, `render()` 는 `root` 를 통째로
     비우고 다시 만든다. 그러면 **포커스된 입력 요소가 사라진다** — iOS 에서는 키보드가 내려가고
     길게 눌러 띄운 "붙여넣기" 메뉴가 닫혀서, 적재 중에는 링크를 붙여넣을 수가 없었다
     (실측 2026-07-31 사용자 보고). 입력 중에는 그리지 않고, 손을 뗀 뒤에 밀린 것을 그린다.
     이러면 적재 상태 표시가 잠깐 멈추지만, 그건 **사용자가 직접 보고 있는 화면**이 아니다. */
  var renderDeferred = false;

  function typingInApp() {
    var active = document.activeElement;
    if (!active || !root.contains(active)) return false;
    var tag = active.tagName;
    return tag === "INPUT" || tag === "TEXTAREA" || active.isContentEditable === true;
  }

  /* 🔴 위 방어를 **모든** render 에 걸었더니 사용자 조작의 결과까지 삼켰다 — 실측
     2026-07-31(배포본): 링크를 붙여넣고 커서가 입력창에 있는 동안 "적재" 버튼이 **나타나지
     않았다**(blur 하면 나타난다). 계획 시트도, 409 오류 카드도 같은 이유로 안 뜬다. 즉
     "붙여넣고 눌렀는데 아무 일도 안 난다"의 뿌리가 이것이다.

     뿌리는 미루기가 아니라 **재렌더가 DOM 이 가진 상태를 부순다**는 것이다(뷰어 iframe·`<details>`
     와 같은 부류 — 포커스와 캐럿도 DOM 이 가진 상태다). 그래서 순서를 바꾼다:
       · `render()` — 사용자 조작은 항상 그리되, 복원할 수 없는 IME 조합 중에만 미룬다.
         그 밖의 검색 타이핑은 포커스·캐럿을 되살린다.
       · `renderBackground()` — 자료 목록 재수집용. 타이핑 중이면 미룬다. 포커스 복원으로는
         iOS 의 길게 눌러 띄운 "붙여넣기" 메뉴를 되살릴 수 없어서, 그 방어만 남긴다.
       · `renderIngestBackground()` — 적재 폴링용. 큐 슬롯과 상태 문구만 바꾼다. */
  function focusKeyOf(node) {
    return node && node.getAttribute ? node.getAttribute("data-focus-key") : null;
  }

  function captureFocus() {
    var active = document.activeElement;
    if (!active || !root.contains(active)) return null;
    var key = focusKeyOf(active);
    if (!key) return null;
    var start = null;
    var end = null;
    try { start = active.selectionStart; end = active.selectionEnd; } catch (error) {}
    return { key: key, start: start, end: end };
  }

  function restoreFocus(saved) {
    if (!saved) return;
    var node = root.querySelector('[data-focus-key="' + saved.key + '"]');
    if (!node) return;
    node.focus();
    if (saved.start === null || saved.start === undefined) return;
    try { node.setSelectionRange(saved.start, saved.end); } catch (error) {}
  }

  function renderBackground() {
    if (typingInApp()) { renderDeferred = true; return; }
    render();
  }

  /* 적재 상태는 폴링 주기마다 바뀌지만 목록 데이터는 그렇지 않다. 폴링 응답마다 root 전체를
     다시 만들면 읽던 목록의 DOM·스크롤 앵커·content-visibility 계산이 반복해서 흔들린다.
     폴링이 소유한 큐 슬롯과 상태 문구만 교체하고, 목록은 완료 후 loadData()가 실제 자료를
     다시 수집할 때만 렌더한다. */
  /* 적재 배지를 **제자리에서** 갈아 끼운다. 여기서 render() 를 부르면 검색 IME 조합과
     포커스가 날아간다 — 이 함수가 애초에 존재하는 이유가 그것이다. 배지도 같은 규칙을
     따른다: 행을 다시 만들지 않고 두 자리(날짜 칸·모바일 메타)만 고쳐 쓴다. */
  function patchIngestBadges() {
    var ingesting = ingestByDocument();
    var rows = root.querySelectorAll(".item-row[data-item-path]");
    Array.prototype.forEach.call(rows, function (row) {
      var entry = ingesting[row.getAttribute("data-item-path")];
      var badge = entry ? ingestBadgeText() : "";
      row.classList.toggle("is-ingesting", !!entry);
      var added = row.querySelector(".cell-added");
      // 되돌릴 날짜는 첫 렌더가 적어 둔 것이다. 여기서 만들지 않는다 — 만들면 배지가
      // 이미 붙은 칸에서 빈 문자열을 학습하고, 그 뒤로 날짜가 영영 안 돌아온다.
      if (added && added.hasAttribute("data-added-plain")) {
        added.classList.toggle("is-ingesting", !!entry);
        added.textContent = badge || added.getAttribute("data-added-plain");
      }
      var mobile = row.querySelector(".mobile-meta");
      if (mobile) {
        var plain = mobile.getAttribute("data-meta-plain") || "";
        var long = entry ? ingestBadgeMeta(entry) : "";
        mobile.textContent = long ? (plain ? long + " · " + plain : long) : plain;
      }
    });
  }

  function renderIngestBackground() {
    var subtitle = root.querySelector(".page-subtitle");
    if (subtitle) subtitle.textContent = pageSubtitle();
    patchIngestBadges();
    var slot = root.querySelector("[data-ingest-slot]");
    if (!slot) return;
    var queue = makeIngestQueue();
    slot.replaceChildren();
    if (queue) slot.appendChild(queue);
  }

  function render() {
    // 포커스·캐럿과 달리 IME 조합 세션은 새 input DOM에 복원할 수 없다. 검색 debounce뿐 아니라
    // 별표 응답·토스트 만료 같은 비동기 render도 조합이 끝날 때까지 root를 교체하면 안 된다.
    if (state.searchComposing) { renderDeferred = true; return; }
    var savedFocus = captureFocus();
    renderDeferred = false;
    document.documentElement.setAttribute("data-learning-view", learningView());
    root.textContent = "";
    var shell = el("div", "app-shell" + (state.editing ? " is-editing" : ""));
    var inner = el("div", "app-inner");
    inner.appendChild(makeHeader());
    if (state.archiveView) inner.appendChild(makeArchiveView());
    else {
      var main = el("main", "content");
      var errorCard = makeErrorCard();
      if (errorCard) main.appendChild(errorCard);
      var stale = makeStaleNotice();
      if (stale) main.appendChild(stale);
      var warning = makeWarningPanel();
      if (warning) main.appendChild(warning);
      var actionError = state.actionError ? makeActionError(state.actionError) : null;
      if (actionError) main.appendChild(actionError);
      var starError = state.starError ? makeActionError(state.starError) : null;
      if (starError) main.appendChild(starError);
      main.appendChild(makeIngestSlot());
      var desktopHead = makeDesktopHead();
      if (desktopHead) main.appendChild(desktopHead);
      if (!state.loading && (!state.error || state.items.length)) main.appendChild(makeList());
      else if (state.loading) main.appendChild(el("section", "empty-panel", "목록을 불러오는 중"));
      main.appendChild(makeFooter());
      inner.appendChild(main);
    }
    shell.appendChild(inner);
    var bar = makeSelectionBar();
    if (bar) shell.appendChild(bar);
    var sheet = makeSheet();
    var ingestSheet = makeIngestSheet();
    // 🔴 모달이 떠 있으면 토스트를 띄우지 않는다. 토스트는 `z-index:60` 에 하단 정렬이고 시트는
    //    `50` 에 하단 정렬이라, 둘이 겹치면 토스트가 정확히 시트의 **주 버튼 자리**에 앉는다
    //    (실측 2026-07-31: "이 계획대로 실행합니다" 다이얼로그의 `실행` 자리에 "적재 기록을
    //    지웠습니다" 가 보여, 버튼 라벨이 완료 메시지인 것처럼 읽히고 누를 수도 없었다).
    //    모달이 화면을 소유하는 동안 지난 작업의 알림은 물러나야 한다.
    if (state.toast && !sheet && !ingestSheet) {
      var toast = el("div", "toast" + (state.toast.error ? " error" : ""), state.toast.message);
      toast.setAttribute("role", "status");
      shell.appendChild(toast);
    }
    if (sheet) shell.appendChild(sheet);
    if (ingestSheet) shell.appendChild(ingestSheet);
    root.appendChild(shell);
    // 🔴 모달이 떠 있으면 되살리지 않는다 — 시트가 화면을 소유하는 동안 커서를 뒤 화면의
    //    입력창으로 되돌리면 iOS 에서 키보드가 시트를 덮는다.
    if (!sheet && !ingestSheet) restoreFocus(savedFocus);
    syncViewer();
  }

  function makeActionError(error) {
    var card = el("article", "error-card");
    card.setAttribute("role", "alert");
    var heading = el("h2", "error-heading", "작업이 실패했습니다");
    card.appendChild(heading);
    card.appendChild(el("p", "", error.message || "작업이 실패했습니다"));
    card.appendChild(errorField("실행 명령", error.command || "POST API"));
    card.appendChild(errorField("exit code", error.exitCode === null || error.exitCode === undefined ? "없음" : String(error.exitCode)));
    card.appendChild(errorField("stderr", error.stderr || "없음"));
    return card;
  }

  document.addEventListener("keydown", function (event) {
    if (event.key === "Escape" && state.viewer) {
      closeDoc();
    } else if (event.key === "Escape" && state.sheet) {
      state.sheet = null;
      render();
    } else if (event.key === "Escape" && state.ingestPlan && !state.ingestBusy) {
      state.ingestPlan = null;
      render();
    }
  });

  if (window.history && "scrollRestoration" in window.history) {
    window.history.scrollRestoration = "manual";
  }
  if (window.history && window.history.replaceState) {
    try {
      window.history.replaceState(
        historyState("list", { learningList: listHistorySnapshot(window.scrollY), learningViewer: null }),
        "",
        window.location.href
      );
    } catch (error) { /* 초기 목록은 History API 없이도 표시한다. */ }
  }
  render();
  loadData(true);
  document.addEventListener("focusout", function () {
    if (!renderDeferred) return;
    window.setTimeout(function () {
      if (renderDeferred && !typingInApp()) render();
    }, 0);
  });
  loadIngest();
}());
</script>
<script src="/airlock-return.js" data-mode="corner" defer></script>
</body>
</html>
