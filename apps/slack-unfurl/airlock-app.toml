contract = 1
id = "slack-unfurl"

# Socket Mode keeps the worker behind outbound-only connections. The suffix is
# configuration because apps/ is public; a package must not know any company's
# internal DNS name.
[config.defaults]
# Reserved documentation suffix: a config generated by `airlock-config init`
# remains valid but cannot match a real Airlock link until the operator replaces it.
domain_suffix = "example.test"
# These are environment-variable NAMES. Their values live only in the
# operator-owned EnvironmentFile read by the user unit.
bot_token_env = "SLACK_UNFURL_BOT_TOKEN"
app_token_env = "SLACK_UNFURL_APP_TOKEN"
# Root-path document links are indistinguishable from arbitrary services by
# shape alone. Only explicitly allowed dedicated publish ports may use them.
dedicated_ports = "8000,19920"

[config]
runtime_env = [
  "AIRLOCK_SLACK_UNFURL_ALLOWED_PORTS",
  "AIRLOCK_SLACK_UNFURL_APP_TOKEN_NAME",
  "AIRLOCK_SLACK_UNFURL_BOT_TOKEN_NAME",
  "AIRLOCK_SLACK_UNFURL_DOMAIN",
]

[[prerequisites]]
command = "python3"
predicate = "major-gte"
expected = "3.11"
fix = "sudo apt-get update && sudo apt-get install -y python3"
note = "Application runtime"

[[prerequisites]]
command = "systemctl"
predicate = "present"
expected = "-"
fix = "sudo apt-get update && sudo apt-get install -y systemd"
note = "User service"

[artifacts]
units = ["airlock-slack-unfurl.service"]
files = ["~/.local/share/airlock-slack-unfurl/"]

# No [tile], port, or nginx fragment: this is an outbound Socket Mode worker.
[audience]
supported = ["owner"]
default = "owner"
