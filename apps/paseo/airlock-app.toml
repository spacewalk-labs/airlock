contract = 1
id = "paseo"

# Transcribed from the former APP_DEFAULTS["paseo"] entry.
[config]
# Env-var names this installer READS from the environment but which are not
# operator config. TASKS_MAX is a genuine knob, deliberately left here rather than
# promoted: it is read as a raw string with its own default, and declaring it as a
# config key would export it and change what the installer sees. MEM_CAP_BYTES is a
# test seam the source marks as not a supported knob (install.sh, "Resource backstop" block).
# ALLOW_UNBACKED_MEM is compared against the literal `1` (install.sh, "Resource backstop" block), so
# declaring it as a bool would export "true" and silently stop matching.
# UISTATE_DIR is a test seam, not a knob: the ui-state backend derives its state
# directory from XDG in production and the unit never sets this, so declaring it as
# a config key would export a value the installer would then have to keep in sync
# with a path nobody configures. Its offline test sets it to a tmpdir.
runtime_env = [
  "AIRLOCK_PASEO_ALLOW_UNBACKED_MEM",
  "AIRLOCK_PASEO_MEM_CAP_BYTES",
  "AIRLOCK_PASEO_TASKS_MAX",
  "AIRLOCK_PASEO_UISTATE_DIR",
]

[config.defaults]
https_port = 19950
gate_port = 19951
backend_port = 19952
browse = false
browse_ws_port = 19953
# agy-acp: registers Google Antigravity's `agy` CLI as the Paseo provider
# `agy` (config-only — see apps/paseo/agy-acp/README.md). Off by default.
agy = false
# Loopback home for the web-UI state paseo otherwise keeps per browser (the
# sidebar's project/workspace order). Proxied by this app's own gate under
# /airlock-ui-state/, never tailscale-served, so it is not a serve_ports entry.
uistate_port = 19954
# empty = the installer's own pinned version wins. A value here OVERRIDES
# that pin, so it must default to "" — a real version string would silently
# freeze every box on this release.
version = ""

# Paseo's runtime requirements, including the bundle integrity checker (F11).
[[prerequisites]]
command = "node"
predicate = "major-gte"
expected = "20"
fix = "curl -fsSL https://deb.nodesource.com/setup_20.x | sudo -E bash - && sudo apt-get install -y nodejs"
note = "Paseo runtime - NOT snap: snap re-execs through setuid snap-confine, which the unit's NoNewPrivileges neuters"

[[prerequisites]]
command = "npm"
predicate = "present"
expected = "-"
fix = "curl -fsSL https://deb.nodesource.com/setup_20.x | sudo -E bash - && sudo apt-get install -y nodejs"
note = "Package manager - ships with the same non-snap node"

[[prerequisites]]
command = "systemctl"
predicate = "present"
expected = "-"
fix = "sudo apt-get update && sudo apt-get install -y systemd"
note = "User service"

[[prerequisites]]
command = "tailscale"
predicate = "present"
expected = "-"
fix = "sudo apt-get install -y curl && curl -fsSL https://tailscale.com/install.sh | sh"
note = "Private ingress"

[[prerequisites]]
command = "python3"
predicate = "major-gte"
expected = "3.11"
fix = "sudo apt-get update && sudo apt-get install -y python3"
note = "Patch helpers"

[[prerequisites]]
command = "curl"
predicate = "present"
expected = "-"
fix = "sudo apt-get update && sudo apt-get install -y curl"
note = "Smoke check"

[[prerequisites]]
command = "sha256sum"
predicate = "present"
expected = "-"
fix = "sudo apt-get update && sudo apt-get install -y coreutils"
note = "Bundled Paseo package integrity"

[[prerequisites]]
command = "ss"
predicate = "present"
expected = "-"
fix = "sudo apt-get update && sudo apt-get install -y iproute2"
note = "Backend readiness check"

[[prerequisites]]
command = "sudo"
predicate = "present"
expected = "-"
fix = "su -c 'apt-get update && apt-get install -y sudo'"
note = "Privileged ingress setup"

# Appendix: one user unit (+ the browse-host unit, browse=true — declared
# unconditionally, same "so the ledger can reclaim it if it exists"
# reasoning as publish's mode-gated fragment), one servers.d fragment plus
# the icon location's own fragments-class dir claim (paseo/ —
# favicon-ring.svg + icons/, [branding] icon_ring), the pinned npm-global
# tree (prefix hardcoded $HOME/.npm-global, apps/paseo/install.sh — the
# guarded bundle installs all seven @getpaseo packages as siblings under
# @getpaseo/, the install-id marker sits there too, and every patch lands
# inside this tree) + its bin symlink, and the browse-host sidecar's own
# install dir (browse=true). The seven packages and the marker are ENUMERATED,
# not claimed as the @getpaseo/ directory: the npm scope is a namespace, and
# a package someone else puts there is not Airlock's to remove. Same shape,
# same reasoning, for the agy-acp fork's own install dir (agy=true) —
# apps/paseo/agy-acp/install.sh stages and builds it under
# ~/.local/share/agy-acp/, entirely separate from the npm-global tree above.
# Deliberately NOT declared (retained data, per the Appendix): ~/.paseo/
# (config.json, patched in place, never removed) and
# ~/.cache/ms-playwright/ (a SHARED Playwright cache other tools may use —
# never Airlock's alone to remove). ~/.nvm/ is never touched or claimed
# either — install/preflight.sh's airlock_load_nvm only SOURCES nvm.sh
# (if present) to put an nvm-managed node/npm on PATH; it is not something
# this app installs or owns. The agy Paseo-provider entry inside config.json
# (agents.providers.agy) and the ~/.gemini/config/skills.json entry follow
# ~/.paseo/'s own precedent exactly — both live inside a file this app
# already treats as retained data, so they stay retained too rather than
# gaining a second, key-level rollback mechanism nothing else here has.
[artifacts]
units = ["airlock-paseo.service", "airlock-paseo-browse-host.service",
         "airlock-paseo-uistate.service"]
fragments = ["servers.d/paseo.conf", "paseo/"]
files = ["~/.npm-global/lib/node_modules/@getpaseo/cli/",
         "~/.npm-global/lib/node_modules/@getpaseo/client/",
         "~/.npm-global/lib/node_modules/@getpaseo/highlight/",
         "~/.npm-global/lib/node_modules/@getpaseo/plugin/",
         "~/.npm-global/lib/node_modules/@getpaseo/protocol/",
         "~/.npm-global/lib/node_modules/@getpaseo/relay/",
         "~/.npm-global/lib/node_modules/@getpaseo/server/",
         "~/.npm-global/lib/node_modules/@getpaseo/.airlock-install-id",
         "~/.npm-global/bin/paseo",
         "~/.local/share/paseo-browse-host/",
         "~/.local/share/agy-acp/"]
serve_ports = ["https_port"]

[serve.https]
https_port = "gate_port"

# From hub/index.html's APPS table (paseo row), image moved in-app (was
# hub/assets/paseo.png — repo-root NOTICE updated to the new path) and
# staged by the platform like every other declared tile icon (F4). paseo
# has no public_port at all (https only), so unlike devterm there is no
# [plaintext_redirect] here.
[tile]
label = "Paseo"
sub = "agent orchestration"
cat = "coding"
icon = "paseo.png"

[audience]
supported = ["owner"]
default = "owner"
