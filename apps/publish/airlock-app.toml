contract = 1
id = "publish"

# Transcribed from the former APP_DEFAULTS["publish"] entry. public_target's
# nested keys keep NO central defaults, matching today's split exactly:
# install.sh applies its own per-key defaults inline (mode -> "remote",
# token_env -> "AIRLOCK_PUBLISH_TOKEN", gated_dir/htpasswd_dir/htpasswd_bin
# -> their own fallbacks) — only the allowed key SET was ever centrally
# declared (the former NESTED_APP_KEYS[("publish","public_target")]).
[config]
# Env-var names this installer WRITES rather than reads. Eleven of them are
# `Environment=` lines the renderer puts on the unit (apps/publish/render.sh:27-40)
# and the backend reads at runtime; the real operator-facing config for this app
# goes through [config.tables.public_target] above. Declaring them as config keys
# instead would merge them into resolved config and export them all — a knob-shaped
# thing that does not behave like a knob. See [config].runtime_env in
# docs/design/app-package-contract.md.
runtime_env = [
  "AIRLOCK_PUBLISH_BASE_URL",
  "AIRLOCK_PUBLISH_DOC_AUDIENCE",
  "AIRLOCK_PUBLISH_DOC_URL",
  "AIRLOCK_PUBLISH_GATED_DIR",
  "AIRLOCK_PUBLISH_HTPASSWD_BIN",
  "AIRLOCK_PUBLISH_HTPASSWD_DIR",
  "AIRLOCK_PUBLISH_INGEST_URL",
  "AIRLOCK_PUBLISH_PUBLIC_DIR",
  "AIRLOCK_PUBLISH_PUBLIC_MODE",
  "AIRLOCK_PUBLISH_STATE_DIR",
  "AIRLOCK_PUBLISH_TOKEN",
  "AIRLOCK_PUBLISH_TOKEN_ENV",
  "AIRLOCK_PUBLISH_TOKEN_HEADER",
  "AIRLOCK_PUBLISH_UPLOADS_DIR",
]

[config.defaults]
# The document-view port sits OUTSIDE the 199xx block the rest of this product
# uses, on purpose: it is the one port a human types or pastes into a chat, so it
# is chosen to be short and memorable rather than collision-free. The cost is
# real — 8000 is the most contended port on a dev box, and this installer does
# NOT probe for a holder before handing the port to `tailscale serve` (publish
# calls no airlock_handover_user_resource). A box that already runs something on
# 8000 should set [apps.publish] https_port in its own airlock.toml.
https_port = 8000
backend_port = 19922
gate_port = 19925
share_dir = "/opt/airlock/share"
# Directory whose CONTENTS this installer stages into <share_dir>/_assets, the
# root-absolute /_assets/ route render.sh serves. Empty = stage nothing and leave
# whatever is there alone (the pre-2026-09-07 behaviour).
#
# The route has always been the product's; the directory it points at was not
# owned by anything, so each box grew its own hand-made shape — one a symlink into
# a home checkout, one a hand-copied directory, one a symlink whose target sat
# under a 0700 ancestor that nginx could not traverse. That last box answered 403
# to every document asset, including files that do not exist, which is
# indistinguishable from the identity gate's own 403. Staging a real copy the
# installer owns removes both the drift and the dependency on home permissions.
#
# It is a COPY on purpose: a symlink is only as good as the traversal bits of
# every ancestor of its target, and those live in a user's home where this
# installer has no business widening anything.
assets_dir = ""
# A box may opt into the tailnet-member document-view tier. False keeps the
# dedicated port behind the existing owner+collaborators gate.
tailnet_view = false
# Expose only GET /publish/api/meta to authenticated tailnet members. The
# manager and every other /publish/api/ route keep the hub allowlist gate.
title_meta = false

[config.tables.public_target]
allowed_keys = ["mode", "ingest_url", "base_url", "token_env", "token_header",
                 "public_dir", "gated_dir", "htpasswd_dir", "htpasswd_bin"]

# Transcribed from install/prerequisites.tsv's four publish rows (F11).
[[prerequisites]]
command = "python3"
predicate = "major-gte"
expected = "3.11"
fix = "sudo apt-get update && sudo apt-get install -y python3"
note = "Application runtime"

[[prerequisites]]
command = "systemctl"
predicate = "present"
expected = "-"
fix = "sudo apt-get update && sudo apt-get install -y systemd"
note = "User services"

[[prerequisites]]
command = "curl"
predicate = "present"
expected = "-"
fix = "sudo apt-get update && sudo apt-get install -y curl"
note = "Smoke check"

[[prerequisites]]
command = "sudo"
predicate = "present"
expected = "-"
fix = "su -c 'apt-get update && apt-get install -y sudo'"
note = "Shared directory setup"

# Appendix: three user units, two hub/public-includes fragments (the gated
# one carries the gate only when public_target.mode = "local"; remote mode
# writes it EMPTY rather than removing it, because the operator's own server
# block includes that path and an include with nothing behind it makes nginx
# refuse to load. Declaring it here is what lets the ledger reclaim it when
# the app is removed — and that removal is the one case where the operator
# must delete their include line too, see the README), and the manager
# webroot page. Deliberately NOT declared (platform-protected / retained
# operator data, per the ADR appendix and revision-9 note — declaring any
# of these removable would be fatal-in-spirit even where the schema
# wouldn't catch it): ~/.local/state/airlock/publish-public.json (inside
# AIRLOCK_STATE_DIR — platform state, not an app artifact), /opt/airlock/
# share* (share_dir/public_dir/gated_dir), the htpasswd auth directory, and
# ~/uploads. The dedicated HTTPS surface targets the read-only nginx server on
# gate_port; backend_port remains loopback-only behind the hub manager/API.
[artifacts]
units = ["airlock-publish.service", "airlock-publish-cleanup.service",
         "airlock-publish-cleanup.timer"]
fragments = ["hub-locations.d/publish.conf", "public-includes.d/publish-gated.conf"]
webroot = ["publish/index.html"]
serve_ports = ["https_port"]

[serve.https]
https_port = "gate_port"

# From hub/index.html's APPS table (publish row).
[tile]
label = "Publish"
sub = "static publish"
cat = "docs"
path = "/publish/"
glyph = "app-publish"

# D7. Shared: publishing is the collaborator-facing surface by design, and this
# only writes the configured share_dir. Collaborators can list, upload, and
# remove shared items — stated here rather than inherited from being inside the
# hub server.
[audience]
supported = ["shared", "owner"]
default = "shared"
