# devterm owner gate — generated by apps/devterm/install.sh
server {
    listen 127.0.0.1:19302;
    server_name _;

    location / {
        if ($owner_ok = 0) { return 403; }
        proxy_pass http://127.0.0.1:19301;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 86400s;
        # WS-safe: do NOT add X-Forwarded-* here — some upstreams (orca) verify
        # Origin and break if the forwarded proto/host is rewritten.
    }
}
