# devterm owner gate — generated by apps/devterm/install.sh
server {
    listen 127.0.0.1:19911;
    server_name _;

    location / {
        if ($owner_ok = 0) { return 403; }
        proxy_pass http://127.0.0.1:19913;
        proxy_http_version 1.1;
        # $http_host, NOT $host: $host strips the port, and these gates sit behind a
        # `tailscale serve` entrance on a non-443 port. An upstream that compares the
        # browser's Origin (which always carries the port) against Host would then see
        # a mismatch on every same-origin request — devterm's account/secret write
        # guard answered 403 "forbidden origin" to the owner's own page because of it.
        proxy_set_header Host $http_host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 86400s;
        # WS-safe: do NOT add X-Forwarded-* here — some upstreams (orca) verify
        # Origin and break if the forwarded proto/host is rewritten.
    }

    # platform account panel (hub/assets/accounts) — served here, not by the hub,
    # because accounts.js fetches root-absolute paths on the API's own origin.
    location = /panel.html {
        if ($owner_ok = 0) { return 403; }
        alias /opt/airlock/hub/assets/accounts/panel.html;
        default_type text/html;
        add_header Cache-Control "no-cache" always;
    }
    location = /accounts.js {
        if ($owner_ok = 0) { return 403; }
        alias /opt/airlock/hub/assets/accounts/accounts.js;
        default_type application/javascript;
        add_header Cache-Control "no-cache" always;
    }
}
