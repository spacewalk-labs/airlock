# paseo owner gate — generated by apps/paseo/install.sh
# Written directly (not via emit_owner_gate) so it can add the two headers
# the paseo daemon requires behind TLS: X-Forwarded-Proto https and a Host
# WITH the https port. See install.sh header + apps/paseo/README.md.
server {
    listen 127.0.0.1:19702;
    server_name _;

    # paseo serves an upstream web UI we cannot edit, so the gate serves + injects
    # the shared "return to Airlock" widget (floating, bottom-right).
    location = /airlock-return.js { alias /opt/airlock/hub/assets/airlock-return.js; default_type application/javascript; add_header Cache-Control "no-cache" always; access_log off; }

    location = /favicon.ico {
        if ($owner_ok = 0) { return 403; }
        alias /etc/airlock/nginx/paseo/favicon-ring.svg;
        # nginx types-maps the REQUEST uri (.ico), not the alias target (.svg), so it
        # would label this SVG image/x-icon and the browser would fail to parse it.
        # An empty types{} block drops that mapping so default_type is what ships.
        types { }
        default_type image/svg+xml;
        add_header Cache-Control "no-cache" always;
        access_log off;
    }
    location / {
        if ($owner_ok = 0) { return 403; }
        proxy_pass http://127.0.0.1:19701;
        proxy_http_version 1.1;
        # Host WITH the port — $host strips it and triggers a welcome-screen bug.
        proxy_set_header Host box.example.ts.net:19700;
        # This gate is a plain-http listener, so $scheme would be 'http'. Tell the
        # daemon it is behind TLS or the web UI opens ws:// and the socket dies.
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 86400s;
        # return-to-Airlock widget: uncompressed HTML so sub_filter applies (WS/JS
        # bundles are untouched — sub_filter only rewrites text/html).
        proxy_set_header Accept-Encoding "";
        sub_filter '</body>' '<script src="/airlock-return.js" data-anchor="bottom-right" data-menu="1" data-panel="https://box.example.ts.net:19300/" defer></script></body>';
        sub_filter_once on;
    }
}
