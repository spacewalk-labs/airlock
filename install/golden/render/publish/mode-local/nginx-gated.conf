# gated public snapshots — include inside the public nginx server
location ~ "^/g/(?<gslug>[a-z0-9][a-z0-9-]{2,63})(?<gpath>/.*)?$" {
    auth_basic "Restricted document";
    auth_basic_user_file /opt/airlock/publish-gated-auth/$gslug.htpasswd;
    alias /opt/airlock/share-gated/$gslug$gpath;
    index index.html;
    add_header Cache-Control "no-store" always;
}
