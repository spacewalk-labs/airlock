# orca owner gate — generated by apps/orca/install.sh
map $http_upgrade $orca_redir {
    default     "/orca-web/web-index.html#pairing=deadbeef1234";
    "websocket" "";
}
server {
    listen 127.0.0.1:19602;
    server_name _;

    location = /airlock-return.js { alias /opt/airlock/hub/assets/airlock-return.js; default_type application/javascript; add_header Cache-Control "no-cache" always; access_log off; }

    location / {
        if ($owner_ok = 0) { return 403; }
        proxy_pass http://127.0.0.1:19600;
        proxy_http_version 1.1;
        # $http_host, NOT $host: $host strips the port, and these gates sit behind a
        # `tailscale serve` entrance on a non-443 port. An upstream that compares the
        # browser's Origin (which always carries the port) against Host would then see
        # a mismatch on every same-origin request — devterm's account/secret write
        # guard answered 403 "forbidden origin" to the owner's own page because of it.
        proxy_set_header Host $http_host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 86400s;
        # WS-safe: do NOT add X-Forwarded-* here — some upstreams (orca) verify
        # Origin and break if the forwarded proto/host is rewritten.
        proxy_set_header Accept-Encoding "";
        sub_filter '</body>' '<script src="/airlock-return.js" data-anchor="bottom-right" defer></script></body>';
        sub_filter_once on;
    }
    # ---- patched Orca web client (vendored) + zero-paste entry ----
    location = / {
        absolute_redirect off;
        if ($owner_ok = 0) { return 403; }
        if ($orca_redir) { return 302 $orca_redir; }
        proxy_pass http://127.0.0.1:19600;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 86400s;
        # WS-safe: no X-Forwarded-* (orca verifies Origin).
        # Host stays $host here, unlike the shared gate above, which sends
        # $http_host. This exact-/ location IS orca's websocket route (see the
        # $orca_redir map: an Upgrade request falls through to the proxy), and
        # orca's own Origin verification lives outside this repo — so the entrance
        # authority it is handed is not something to change without a live
        # handshake test. The split is deliberate; do not "unify" it blind.
    }
    location = /web-index.html {
        absolute_redirect off;
        if ($owner_ok = 0) { return 403; }
        return 302 /orca-web/web-index.html$is_args$args;
    }
    location = /orca-web/web-index.html {
        if ($owner_ok = 0) { return 403; }
        alias /opt/airlock/orca-web/dist/web-index.html;
        default_type text/html;
        add_header Cache-Control "no-store" always;
        sub_filter '</body>' '<script src="/airlock-return.js" data-anchor="bottom-right" defer></script></body>';
        sub_filter_once on;
    }
    location /orca-web/assets/ {
        if ($owner_ok = 0) { return 403; }
        alias /opt/airlock/orca-web/dist/assets/;
        access_log off;
    }
}
