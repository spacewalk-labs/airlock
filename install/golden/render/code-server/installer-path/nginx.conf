# code-server slot gate — generated by apps/code-server/install.sh
server {
    listen 127.0.0.1:18808;
    server_name _;

    # owner-only: server-level guard covers every location, WS upgrades included.
    if ($owner_ok = 0) { return 403; }

    location = /airlock-return.js { alias /opt/airlock/hub/assets/airlock-return.js; default_type application/javascript; add_header Cache-Control "no-cache" always; access_log off; }

    # tab-bar shell (single static file). root+try_files, NOT alias (see header).
    location = / {
        root WDIR/render/confd/code-server;
        try_files /shell.html =404;
        default_type text/html;
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
    }
    location = /favicon.ico { return 204; }

    location = /s/1 { return 308 /s/1/; }
    location /s/1/ {
        proxy_pass http://127.0.0.1:18811/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
    location = /s/2 { return 308 /s/2/; }
    location /s/2/ {
        proxy_pass http://127.0.0.1:18812/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
    location = /s/3 { return 308 /s/3/; }
    location /s/3/ {
        proxy_pass http://127.0.0.1:18813/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
    location = /s/4 { return 308 /s/4/; }
    location /s/4/ {
        proxy_pass http://127.0.0.1:18814/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # slot manager API (loopback). Re-inject the gate-verified identity header
    # so the manager can re-check the owner (defense-in-depth).
    location /api/ {
        proxy_pass http://127.0.0.1:18810;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Tailscale-User-Login $http_tailscale_user_login;
    }
}
