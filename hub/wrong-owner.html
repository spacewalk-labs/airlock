<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Not your box</title>
<style>
  :root { --bg:#f5f5f7; --text:#1d1d1f; --muted:#6e6e73; }
  @media (prefers-color-scheme: dark) { :root { --bg:#000; --text:#f5f5f7; --muted:#98989d; } }
  body {
    margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
    background:var(--bg); color:var(--text); text-align:center; padding:2rem;
    font:17px/1.5 -apple-system,"Segoe UI",Roboto,"Noto Sans KR",sans-serif;
  }
  .box { max-width:28rem; }
  h1 { font-size:1.4rem; margin:0 0 .5rem; }
  p { color:var(--muted); margin:.4rem 0; }
</style>
</head>
<body>
  <div class="box">
    <h1>This isn't your Airlock</h1>
    <p>You're signed in, but you're not the owner of this box.</p>
    <p>Each Airlock instance is single-owner. Open your own box's entrance instead.</p>
  </div>
</body>
</html>
