<script>
async function j(url) { const r = await fetch(url, { cache: "no-store" }); return r.ok ? r.json() : null; }

// D7/F14: may an app's tile render for this viewer? Pure and FAIL-CLOSED —
// Fail-closed both ways: only an explicit "shared" audience shows to everyone
// the hub admits. Anything else — "owner", an audience this launcher does not
// know, or none at all — needs a verified owner, so an unknown role (whoami
// fetch failed, role field absent) hides the tile too. Silence is not a
// clearance: an app that never declared who it serves is not thereby shared.
// Extracted so install/test-hub-filter.sh can exercise it in node without a
// browser.
function airlockTileVisible(audience, role) {
  if (audience === "shared") return true;
  return role === "owner";
}

// F14: which tile model renders for an app — manifest webjson only (child
// 4/P3 retires the built-in APPS presentation registry and its name-fallback:
// every app reaching this function is a shipped package, so its tile data,
// if any, always comes from its manifest). No [tile] in the manifest renders
// NOTHING (null). Extracted so install/test-hub-filter.sh can exercise it in
// node.
function airlockTileMeta(entry) {
  const t = entry.tile;
  if (!t) return null;
  return { label: t.label, sub: t.sub || "", cat: t.cat || null,
           path: t.path, glyph: t.glyph || null, brand: t.icon || null };
}

// The heading for tiles that name no section — the packages, i.e. what this box
// actually runs. Shortcuts name their own heading in airlock.toml (bin/airlock-
// config defaults it to "Shortcuts" and always emits it), so this constant is
// the ONLY heading text the launcher owns.
const AIRLOCK_TOOLS_SECTION = "Tools";

// Said on screen under any section that holds a shortcut. The gate is the one
// thing a shortcut tile cannot inherit: it looks like every other tile, and the
// difference — a different origin, a different sign-in, nobody checking the
// Airlock identity — is invisible until you have already clicked.
const AIRLOCK_SHORTCUT_NOTE =
  "These leave Airlock: each opens on another host in a new tab and does its own sign-in. The Airlock gate does not cover them.";

// Group tiles into the headed sections the launcher draws, in draw order.
// Pure — takes the webjson apps map and the names to place, returns
// [{ title, names }] — so install/test-hub-sections.sh can exercise it in node
// without a browser.
//
// Order is first-seen, with one exception: the unnamed group (what runs here)
// is pinned first. First-seen means webjson's key order, and webjson is sorted
// by app id — so without the pin, a single shortcut whose id sorts ahead of
// every package id would open the launcher with the tiles that send you away.
function airlockTileSections(apps, names) {
  const order = [], by = new Map();
  for (const name of names) {
    const title = apps[name].section || AIRLOCK_TOOLS_SECTION;
    if (!by.has(title)) { by.set(title, []); order.push(title); }
    by.get(title).push(name);
  }
  const first = order.indexOf(AIRLOCK_TOOLS_SECTION);
  if (first > 0) order.splice(0, 0, order.splice(first, 1)[0]);
  return order.map(title => ({ title: title, names: by.get(title) }));
}

function airlockSourceLabel(entry) {
  return entry && entry.source_class === "explicit" ? "Added app" : "";
}

function airlockMatchesApp(name, label, query) {
  const q = String(query || "").trim().toLowerCase();
  if (!q) return true;
  return (String(name) + " " + String(label)).toLowerCase().includes(q);
}

// How many things the gear badge is counting, from one payload of
// GET /monitor/api/owner/updates. Pure and total, so install/test-hub-filter.sh
// can hold it against contract fixtures in node — the badge is the one number
// on this page a person acts on, and it has to be arithmetic, not a render
// side effect.
//
// Three sources, the three the confirmed mockup adds up (본체 1 + 앱 2 +
// Codex CLI 1 = 4): the platform itself; EVERY app the ledger flagged,
// including a lock-mismatch, which needs a person precisely because it gets no
// button; and the one harness binary that does not update itself. Hook drift
// and skill wiring are deliberately NOT counted — they are states to look at,
// not items to apply, and a badge that mixes the two stops meaning anything.
//
// Missing/!ok fields count as nothing. An absent `latest` is "we could not
// check", and the fail-quiet direction for a number that provokes a click is
// down: a badge that overstates sends someone to a panel with nothing in it.
function airlockUpdateCount(d) {
  if (!d) return 0;
  let n = 0;
  if (d.platform && d.platform.available) n += 1;
  n += airlockUpdateAppIds(d).length;
  if (airlockCodexOutdated(d)) n += 1;
  return n;
}

// THE app list, normalised once. Every consumer — the badge count, the panel
// rows, the tile dots, the badge footnote — goes through this function, so
// there is exactly one answer to "which apps have an update" and the four
// surfaces cannot drift apart.
//
// Array.isArray, not a truthiness test, and it matters twice: `apps: {}` is a
// shape a half-written backend really does emit, and it breaks BOTH readers —
// `{}.filter` throws, and so does `for (const a of {})`. A throw halfway
// through a render is the worst outcome available: it lands after the badge has
// been rewritten and before the dots have, so the launcher ends up showing a
// count and a set of dots that disagree, with nothing on screen saying why.
function airlockUpdateApps(d) {
  const apps = d && Array.isArray(d.apps) ? d.apps : [];
  return apps.filter(a => a && a.id);
}

function airlockUpdateAppIds(d) {
  return airlockUpdateApps(d).map(a => a.id);
}

// Which of the settings panel's named actions this build can actually RUN.
//
// Kept as a pure function next to the badge arithmetic, and for the same reason:
// it is the difference between a button that works and a button that lies, and
// node can hold it against fixtures where a browser is not available.
//
// `platform` and `app:<id>` both POST /monitor/api/owner/updates/execute. Nothing
// else does, and the two exclusions are deliberate, not unfinished:
//   review:<id>  — an external package whose source digest moved. Re-approving a
//                  package lock is a terminal procedure (owner decision LOCK_UI_V1);
//                  v1 shows and reviews, it does not re-approve. The backend refuses
//                  a lock-mismatch id as well, so this is presentation over a real
//                  boundary rather than the boundary itself.
//   harness:*    — the Codex CLI and the hook/skill layers belong to HARNESS_PANEL.
function airlockUpdActionArmed(action) {
  const a = String(action || "");
  return a === "platform" || (a.startsWith("app:") && a.length > 4);
}

// The request body for an armed action. Returns null for anything not armed, so a
// mis-drawn button cannot turn into a request that the backend then has to refuse.
function airlockUpdActionBody(action) {
  const a = String(action || "");
  if (a === "platform") return { action: "platform" };
  if (a.startsWith("app:") && a.length > 4) return { action: "app", id: a.slice(4) };
  return null;
}

// One status summary (`before`/`after` from bin/airlock-status --json) as one clause.
function airlockUpdStatusText(s) {
  if (!s) return "";
  if (s.error) return String(s.error);
  const bits = ["airlock-status rc=" + s.rc];
  if (s.verdict) bits.push(String(s.verdict));
  const c = s.counts;
  if (c) bits.push(c.fail + " fail · " + c.warn + " warn · " + c.unchecked + " 미확인");
  return bits.join(" · ");
}

// GET /monitor/api/owner/updates/run -> what the panel says and whether it may run.
//
// Total, and every branch names a real state rather than falling through to an
// encouraging default. In particular `busy: null` is "we could not measure the
// updater's lock", which is NOT "nothing is running" — an unmeasured lock leaves the
// buttons alone rather than either blocking them or promising they are safe.
function airlockUpdRunLine(state) {
  if (!state) return { text: "", detail: "", recovery: "", blocked: false };
  if (state.enabled === false) {
    return { text: "이 박스에서는 패널에서 실행할 수 없습니다.",
             detail: "터미널에서 bash bin/airlock-update 를 쓰십시오.",
             recovery: "", blocked: true, bad: false };
  }
  const run = state.run;
  const label = run && run.action === "app" && run.appId
    ? "'" + run.appId + "' 재설치" : "본체 업데이트";
  if (run && (run.status === "starting" || run.status === "running")) {
    return { text: "실행 중 — " + label + ".",
             detail: "설치기가 도는 동안 이 화면의 연결이 잠시 끊길 수 있습니다. "
                   + "결과는 다시 붙으면 여기에 나옵니다.",
             recovery: "", blocked: true, bad: false };
  }
  if (state.busy === true) {
    return { text: "다른 Airlock 갱신 작업이 진행 중입니다.",
             detail: "터미널에서 시작된 업데이트이거나 매일 도는 감지입니다 — "
                   + "끝난 뒤 다시 시도하십시오.",
             recovery: "", blocked: true, bad: false };
  }
  if (!run) return { text: "", detail: "", recovery: "", blocked: false, bad: false };
  if (run.status === "done") {
    const moved = run.before && run.after && run.before.revision !== run.after.revision;
    return {
      text: "지난 실행 성공 — " + label + ".",
      detail: (moved ? "revision " + String(run.before.revision).slice(0, 12) + " → "
                       + String(run.after.revision).slice(0, 12) + " · "
                     : (run.after && run.after.revision
                        ? "revision " + String(run.after.revision).slice(0, 12) + " (변동 없음) · "
                        : ""))
              + airlockUpdStatusText(run.after),
      recovery: "", blocked: false, bad: false };
  }
  const rc = run.exitCode === null || run.exitCode === undefined ? "?" : run.exitCode;
  return {
    text: (run.status === "interrupted" ? "지난 실행이 끝맺지 못했습니다 — " : "지난 실행 실패 — ")
          + label + (run.status === "interrupted" ? "." : " (rc=" + rc + ")."),
    detail: [run.note, airlockUpdStatusText(run.after)].filter(Boolean).join(" "),
    recovery: (run.recovery && run.recovery.command) || "",
    recoveryNote: (run.recovery && run.recovery.reason) || "",
    blocked: false, bad: true };
}

// Is the box's Codex CLI behind npm? Both versions have to be known: `latest`
// absent means the check did not run, which is not the same as up to date.
function airlockCodexOutdated(d) {
  const c = d && d.harness && d.harness.codex;
  return !!(c && c.installed && c.latest && c.installed !== c.latest);
}

// Same-day shows a clock; older shows the date too, so a stale timestamp cannot
// quietly relabel itself as today (the message strip's fmtCollected bug). Pure and
// global because two surfaces read it now — the panel's "마지막 확인" and the skill
// row's clone sync — and two copies would drift.
function airlockWhen(iso) {
  if (!iso) return "";
  let d;
  try { d = new Date(iso); } catch (_) { return String(iso); }
  if (isNaN(d.getTime())) return String(iso);
  const clock = d.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
  return (d.toDateString() === new Date().toDateString())
    ? "오늘 " + clock
    : d.toLocaleDateString() + " " + clock;
}

// ── the 하네스 section ───────────────────────────────────────────────────
//
// Four layers, one of which can be pressed. Kept as pure functions beside the badge
// arithmetic for the same reason: node can hold them against contract fixtures, and
// every one of them is the difference between a row that reports and a row that
// claims.
//
// The harness actions live in their OWN namespace, not in airlockUpdActionArmed's.
// They POST a different route with a different run record, and a Codex upgrade must
// not be blocked by (or reported over) an `bin/airlock-update` in flight.
//   harness:codex   — npm install -g @openai/codex@latest, in a tmux window.
//   harness:recheck — one more run of the detection collector, now.
// Hook reconciliation is deliberately absent and always will be: applying a hook is a
// reviewed procedure (/harness-provision), so this section shows drift and stops.
function airlockHarnessActionArmed(action) {
  const a = String(action || "");
  return a === "harness:codex" || a === "harness:recheck";
}

function airlockHarnessBody(action) {
  const a = String(action || "");
  if (a === "harness:codex") return { action: "codex" };
  if (a === "harness:recheck") return { action: "recheck" };
  return null;
}

// The Claude Code CLI row. It updates itself, so the collector takes no `latest` for
// it and this returns no comparison — there is nothing here that can be read as
// "behind", which is the whole reason it is a separate key from codex's pair.
function airlockClaudeLine(d) {
  const c = d && d.harness && d.harness.claude;
  if (!c || !c.installed) return "";
  return c.installed + " · 자체 자동 업데이트로 최신 유지";
}

// The Codex CLI row. Three states and each says which one it is: behind, current, and
// "we could not ask the registry" — that last one is NOT current, and giving it its
// own words is what stops an unreachable npm from reading as up to date.
function airlockCodexLine(d) {
  const c = d && d.harness && d.harness.codex;
  if (!c || !c.installed) return "";
  if (airlockCodexOutdated(d)) {
    return c.installed + " → " + c.latest + " 새 버전 · npm 전역 설치라 수동 갱신 대상";
  }
  return c.installed + (c.latest ? " · 최신" : " · 최신 버전 확인 실패");
}

// The 공통 스킬 row: what each agent can actually invoke, counted per root.
//
// Two counts, never one total. The roots are per agent — Claude Code reads
// ~/.claude/skills and the Codex CLI reads ~/.agents/skills — and a skill wired for
// one and missing for the other raises no error anywhere; it simply never triggers
// for that agent. A single summed number is exactly the shape that hides it.
function airlockSkillsLine(d) {
  const s = d && d.harness && d.harness.skills;
  if (!s || typeof s.claude !== "number" || typeof s.codex !== "number") return "";
  const bits = ["Claude " + s.claude + " · Codex " + s.codex + " 배선"];
  const canon = s.canon;
  if (canon && canon.name) {
    // The last fetch, which this box can measure. NOT "최신": that would need the
    // network, and the collector deliberately does not claim it.
    bits.push(canon.name + (canon.syncedAt ? " " + airlockWhen(canon.syncedAt) + " 동기화" : ""));
  }
  return bits.join(" · ");
}

// 🔴 There is deliberately no "one root is behind the other" verdict here. Measured on
// a live box 2026-09-01: of the 8 names present for Claude and not for the Codex CLI,
// 2 were opt-in canon (no wiring obligation) and 6 were local copies belonging to no
// canon at all. "One root has more" is therefore not "the other is missing something",
// and a chip saying so would have been wrong on its very first reading. Which names a
// root is OWED is a judgment about the canon, and it is made by the wiring checker
// that reads the canon — this row reports what each agent can invoke and stops there.

// GET /monitor/api/owner/harness/run -> what the harness rows say and whether they
// may run. Same discipline as airlockUpdRunLine, minus `busy`: an npm global install
// takes no cross-process mutex, so there is no second updater to measure and this
// function never claims there is one.
function airlockHarnessRunLine(state) {
  if (!state) return { text: "", detail: "", blocked: false, bad: false };
  if (state.enabled === false) {
    return { text: "이 박스에서는 패널에서 갱신할 수 없습니다.",
             detail: "터미널에서 npm install -g @openai/codex@latest 를 쓰십시오.",
             blocked: true, bad: false };
  }
  const run = state.run;
  if (run && (run.status === "starting" || run.status === "running")) {
    return { text: "갱신 중 — Codex CLI.",
             detail: "npm 전역 설치가 끝나면 결과가 여기에 나옵니다.",
             blocked: true, bad: false };
  }
  if (!run) return { text: "", detail: "", blocked: false, bad: false };
  const before = (run.before && run.before.installed) || "";
  const after = (run.after && run.after.installed) || "";
  if (run.status === "done") {
    // `note` on a SUCCESSFUL run is the case npm's exit code cannot see: it installed,
    // and the codex this box actually runs did not move. That reads as a failure here
    // because for the person at the panel it is one.
    const moved = before && after && before !== after;
    return { text: (run.note ? "지난 갱신이 반영되지 않았습니다 — Codex CLI."
                             : "지난 갱신 성공 — Codex CLI."),
             detail: [moved ? before + " → " + after
                            : (after ? after + " (변동 없음)" : ""), run.note]
                     .filter(Boolean).join(" · "),
             blocked: false, bad: !!run.note };
  }
  const rc = run.exitCode === null || run.exitCode === undefined ? "?" : run.exitCode;
  return {
    text: (run.status === "interrupted" ? "지난 갱신이 끝맺지 못했습니다 — Codex CLI."
                                        : "지난 갱신 실패 — Codex CLI (rc=" + rc + ")."),
    detail: [run.note, after ? "설치된 버전은 " + after + " 입니다." : ""]
            .filter(Boolean).join(" "),
    blocked: false, bad: true };
}

(function () {
  const themes = new Set(["system", "light", "dark"]);
  const root = document.documentElement;
  const buttons = document.querySelectorAll(".theme-group [data-theme-btn]");
  const themeColor = document.querySelector('meta[name="theme-color"]');
  const lightPreference = window.matchMedia && window.matchMedia("(prefers-color-scheme: light)");

  function reflect(theme) {
    buttons.forEach(button => {
      button.setAttribute("aria-pressed", String(button.dataset.themeBtn === theme));
    });
    const light = theme === "light" || (theme === "system" && lightPreference && lightPreference.matches);
    if (themeColor) themeColor.content = light ? "#f5f5f7" : "#0a0f1e";
  }

  function setTheme(theme) {
    if (!themes.has(theme)) theme = "system";
    root.dataset.theme = theme;
    try { localStorage.setItem("markwand-theme", theme); } catch (_) {}
    reflect(theme);
  }

  buttons.forEach(button => button.addEventListener("click", () => setTheme(button.dataset.themeBtn)));
  if (lightPreference && lightPreference.addEventListener) {
    lightPreference.addEventListener("change", () => {
      if (root.dataset.theme === "system") reflect("system");
    });
  }
  reflect(themes.has(root.dataset.theme) ? root.dataset.theme : "system");
})();

(async () => {
  const [cfg, me] = [await j("/__airlock.json"), await j("/whoami")];
  if (cfg && cfg.product) {
    document.getElementById("product").textContent = cfg.product;
    document.title = cfg.product;
  }
  if (me && me.login) document.getElementById("who").textContent = me.login;

  const secs = document.getElementById("secs");
  const apps = (cfg && cfg.apps) || {};
  // Canonical host for cross-port links (see the href below). Only accept a
  // dotted name — a short hostname has no certificate.
  const HOST = (cfg && cfg.fqdn && cfg.fqdn.indexOf(".") > 0) ? cfg.fqdn : location.hostname;
  // "feedback" is not a launcher tile — it's the suggestion box below the grid.
  const names = Object.keys(apps).filter(n => n !== "hub" && n !== "feedback");
  if (!names.length) { document.getElementById("empty").hidden = false; return; }
  const tiles = new Map();

  for (const sec of airlockTileSections(apps, names)) {
    // The grid is filled first and the section is attached only if a tile landed
    // in it. Whether a tile renders is decided per tile below (owner audience, no
    // [tile] at all), so a heading built up front is a heading that can end up
    // standing over nothing.
    const grid = document.createElement("div");
    grid.className = "apps";
    let anyShortcut = false;

    for (const name of sec.names) {
      if (!airlockTileVisible(apps[name].audience, me && me.role)) continue;
      const meta = airlockTileMeta(apps[name]);
      if (!meta) continue;
      if (apps[name].shortcut) anyShortcut = true;
      const port = apps[name].port;
      // Ported same-box tools navigate IN PLACE (one-app feel — the return widget
      // brings you back). Only a genuinely third-party service (external=true in
      // airlock.toml) opens a new tab. A separate-port tool is reached via the
      // deployment FQDN so its URL matches the Tailscale cert — that cert covers
      // the FQDN ONLY, so a short hostname or an IP would give the browser a link
      // it cannot verify. Prefer the FQDN the installer measured (cfg.fqdn) over
      // location.hostname: then the tiles are correct no matter which origin this
      // page was opened from.
      const external = !!(apps[name].external || meta.external);
      const href = port ? `https://${HOST}:${port}/` : (meta.path || `/${name}/`);

      const a = document.createElement("a");
      a.className = "app";
      a.href = href;
      a.dataset.appName = name;
      if (meta.cat) a.dataset.cat = meta.cat;
      if (external) { a.target = "_blank"; a.rel = "noopener"; }

      const ic = document.createElement("span");
      ic.className = "ic";
      if (meta.brand) {                    // real brand icon (full-bleed image)
        a.classList.add("has-brand");
        const img = document.createElement("img");
        img.src = meta.brand; img.alt = "";
        ic.appendChild(img);
      } else if (meta.glyph) {
        ic.innerHTML = '<svg viewBox="0 0 24 24"><use href="#' + meta.glyph + '"/></svg>';
      }
      const lb = document.createElement("span");
      lb.className = "lb";
      lb.textContent = meta.label;

      a.append(ic, lb);
      if (meta.sub) {
        const sub = document.createElement("span");
        sub.className = "sub";
        sub.textContent = meta.sub;
        a.appendChild(sub);
      }
      const sourceLabel = airlockSourceLabel(apps[name]);
      if (sourceLabel) {
        const origin = document.createElement("span");
        origin.className = "origin";
        origin.textContent = sourceLabel;
        a.appendChild(origin);
      }
      grid.appendChild(a);
      tiles.set(name, a);
    }

    if (!grid.children.length) continue;
    const wrap = document.createElement("section");
    wrap.className = "sec";
    const h = document.createElement("div");
    h.className = "sec-h";
    h.textContent = sec.title;
    wrap.appendChild(h);
    // Keyed off the tiles that actually rendered, not off the section's declared
    // membership: the note has to be true of what a viewer can see.
    if (anyShortcut) {
      const note = document.createElement("p");
      note.className = "sec-note";
      note.textContent = AIRLOCK_SHORTCUT_NOTE;
      wrap.appendChild(note);
    }
    wrap.appendChild(grid);
    secs.appendChild(wrap);
  }

  if (!tiles.size) { document.getElementById("empty").hidden = false; return; }

  const findWrap = document.getElementById("launcher-find");
  const find = document.getElementById("app-find");
  const findOpen = document.getElementById("find-open");
  const findClose = document.getElementById("find-close");
  const noMatches = document.getElementById("no-matches");

  function filterApps() {
    const query = find.value;
    let matches = 0;
    for (const section of secs.querySelectorAll(".sec")) {
      let sectionMatches = 0;
      for (const tile of section.querySelectorAll(".app")) {
        const meta = airlockTileMeta(apps[tile.dataset.appName]);
        const visible = airlockMatchesApp(tile.dataset.appName, meta.label, query);
        tile.hidden = !visible;
        if (visible) { sectionMatches += 1; matches += 1; }
      }
      section.hidden = !sectionMatches;
    }
    const searching = !!String(query).trim();
    noMatches.hidden = !searching || !!matches;
  }

  function closeFind() {
    find.value = "";
    filterApps();
    findWrap.hidden = true;
    findOpen.setAttribute("aria-expanded", "false");
  }

  findOpen.hidden = false;
  findOpen.addEventListener("click", () => {
    findWrap.hidden = false;
    findOpen.setAttribute("aria-expanded", "true");
    find.focus();
  });
  findClose.addEventListener("click", () => {
    closeFind();
    findOpen.focus();
  });
  find.addEventListener("input", () => {
    if (!find.value.trim()) closeFind();
    else filterApps();
  });
})();

// iOS home-screen standalone: a plain same-origin <a> can bounce out to Safari.
// Force same-origin navigations through location.href so they stay in the app.
// Cross-origin links (separate-port tools, external=true) are left alone.
if (("standalone" in navigator) && navigator.standalone) {
  document.addEventListener("click", function (e) {
    const a = e.target.closest && e.target.closest("a[href]");
    if (!a || a.target === "_blank") return;
    let u; try { u = new URL(a.href, location.href); } catch (_) { return; }
    if (u.origin === location.origin) { e.preventDefault(); location.href = u.href; }
  });
}
</script>

<script>
// Message strip — dev-monitor's "needs a person" preview, above the tool grid: the
// screen a person meets BEFORE choosing a tool. Owner-only (the API 403s everyone
// else anyway; the role check just avoids a doomed fetch). Polls the same endpoint
// the shared return-widget badge reads (hub/assets/airlock-return.js), same-origin
// here so no CORS is involved.
//
// Failure discipline matches the widget's: 403/404 are real "nothing to show" and
// hide the strip; any other failure (5xx, network, bad JSON) leaves the strip exactly
// as it last rendered rather than flashing it away — see airlock-return.js's
// pollUnread for why collapsing every failure to one state was the bug this campaign
// exists to fix.
(async () => {
  const strip = document.getElementById("msgstrip");
  if (!strip) return;
  let me = null;
  try { me = await j("/whoami"); } catch (_) {}
  if (!me || me.role !== "owner") return;      // stays hidden — collaborators draw no fetch

  function fmtClock(iso) {
    try { return new Date(iso).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" }); }
    catch (_) { return iso; }
  }
  // Same-day: a clock time ("마지막 수집 08:41") reads fine. Older than a day, a bare clock
  // time silently relabels itself "today" every time this renders — that is exactly the
  // quiet/dead confusion this strip exists to end, so it switches to a relative age instead.
  function fmtCollected(iso, ageSeconds) {
    if (!iso) return "-";
    if (ageSeconds == null || ageSeconds < 86400) return fmtClock(iso);
    const days = Math.floor(ageSeconds / 86400);
    return days + "일 전 (" + fmtClock(iso) + ")";
  }
  function row(card) {
    const a = document.createElement("a");
    a.className = "ms-row"; a.href = "/monitor/";
    const t = document.createElement("span");
    t.className = "ms-t"; t.textContent = card.title || "";
    const s = document.createElement("span");
    s.className = "ms-s";
    const bits = [card.source || ""];
    if (card.occurrence_count > 1) bits.push("×" + card.occurrence_count);
    s.textContent = bits.join(" · ");
    a.append(t, s);
    return a;
  }

  async function render() {
    let r;
    try { r = await fetch("/monitor/api/owner/messages/preview", { cache: "no-store" }); }
    catch (_) { return; }                       // network failure — keep the last render
    if (r.status === 403 || r.status === 404) { strip.hidden = true; strip.textContent = ""; return; }
    if (!r.ok) return;                           // unexpected status — keep the last render
    let d; try { d = await r.json(); } catch (_) { return; }

    strip.textContent = "";
    strip.hidden = false;
    const n = d.needs_action_count || 0;
    if (n === 0) {
      const wrap = document.createElement("div");
      wrap.className = "ms-quiet";
      const ok = document.createElement("span");
      ok.className = "ok"; ok.textContent = "지금 하실 일이 없습니다.";
      const when = document.createElement("span");
      when.textContent = "마지막 수집 " + fmtCollected(d.collected_at, d.collected_age_seconds);
      wrap.append(ok, when);
      strip.appendChild(wrap);
      return;
    }
    const card = document.createElement("div");
    card.className = "ms-card";
    const hd = document.createElement("div");
    hd.className = "ms-hd";
    const ttl = document.createElement("span");
    ttl.className = "ms-ttl"; ttl.textContent = "받은함";
    const cnt = document.createElement("span");
    cnt.className = "ms-cnt";
    cnt.append("해야 할 일 ");
    const b = document.createElement("b"); b.textContent = String(n);
    cnt.appendChild(b);
    const open = document.createElement("a");
    open.href = "/monitor/"; open.textContent = "받은함 열기 →";
    hd.append(ttl, cnt, open);
    card.appendChild(hd);
    const top = d.top || [];
    top.forEach(c => card.appendChild(row(c)));
    if (n > top.length) {
      const more = document.createElement("a");
      more.className = "ms-row"; more.href = "/monitor/";
      const t = document.createElement("span");
      t.className = "ms-t"; t.textContent = "그 밖에 " + (n - top.length) + "건";
      more.appendChild(t);
      card.appendChild(more);
    }
    strip.appendChild(card);
  }
  render();
  setInterval(render, 30000);
})();
</script>

<script>
// Settings gear — the badge, the sheet, and the tile dots, all from one poll of
// dev-monitor's GET /monitor/api/owner/updates (contract: docs/tasks/active/
// 2026-09-01_airlock-platform-appstore.task.md, "접근"). The hub stays a static
// file: no build step, no __airlock.json change, same as the message strip.
//
// Failure discipline is the strip's, deliberately: 403/404 are a real "this box
// does not offer it" and take the gear away entirely; anything else (5xx,
// network, bad JSON) leaves the last render standing rather than blinking the
// badge off, because a badge that vanishes reads as "you are done" and that was
// the exact bug this campaign exists to fix.
//
// What this card does NOT do: run anything. Every button below ships disabled
// with its action named on it — arming them is UPD_EXEC's card, the account
// entry on the identity pill is ACCT_OWN's, and the four harness layers are
// HARNESS_PANEL's. A disabled control says "not yet" out loud; a live-looking
// button that no-ops does not.
(async () => {
  const gear = document.getElementById("settings-open");
  const panel = document.getElementById("settings-panel");
  const badge = document.getElementById("settings-badge");
  if (!gear || !panel || !badge) return;

  const checkedEl = document.getElementById("set-checked");
  const updEl = document.getElementById("set-updates");
  const updN = document.getElementById("set-upd-n");
  const harnessEl = document.getElementById("set-harness");
  const footEl = document.getElementById("set-foot");
  const runEl = document.getElementById("set-upd-run");
  const harnessRunEl = document.getElementById("set-harness-run");

  function setOpen(on) {
    panel.hidden = !on;
    gear.setAttribute("aria-expanded", String(on));
  }
  gear.addEventListener("click", () => {
    setOpen(panel.hidden);
    // Opening is the one moment a stale run line is worth a request: the panel is
    // otherwise on a slow tick so that a closed sheet costs nothing.
    if (!panel.hidden && runPollStarted) { pollRun(); pollHarness(); }
  });
  // Escape and an outside click both close it. A dropdown you can only dismiss
  // by finding the same 44px target again is a modal wearing a gear.
  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape" && !panel.hidden) { setOpen(false); gear.focus(); }
  });
  document.addEventListener("click", (e) => {
    if (panel.hidden) return;
    if (panel.contains(e.target) || gear.contains(e.target)) return;
    setOpen(false);
  });

  function fmtChecked(iso) {
    return airlockWhen(iso) || "확인 기록 없음";
  }

  // The launcher already holds each app's human name; reuse it rather than
  // printing a package id at a person. Falls back to the id for an app with no
  // tile (owner-audience filtered out, or no [tile] in its manifest at all).
  function appLabel(id) {
    let tile = null;
    try { tile = document.querySelector('.app[data-app-name="' + CSS.escape(id) + '"] .lb'); }
    catch (_) {}
    return (tile && tile.textContent) || String(id);
  }

  // One row shape for every row in the sheet: name, note, optional amber chip,
  // optional button. `kind` is the button grammar — "go" is filled and runs
  // something, "see" is outlined and only shows you something.
  function row(name, note, opt) {
    const o = opt || {};
    const r = document.createElement("div");
    r.className = "set-row";
    const txt = document.createElement("div");
    txt.className = "set-txt";
    const n = document.createElement("div");
    n.className = "set-name"; n.textContent = name;
    const sub = document.createElement("div");
    sub.className = "set-note"; sub.textContent = note;
    txt.append(n, sub);
    if (o.chip) {
      const chip = document.createElement("div");
      const span = document.createElement("span");
      span.className = "set-chip"; span.textContent = o.chip;
      chip.appendChild(span);
      txt.appendChild(chip);
    }
    // A detail line the row can reveal. Hidden until its own button is pressed, and
    // it is TEXT the backend measured, never a second render of the same claim: the
    // hook row's detail is the wiring checker's own output line.
    if (o.detail) {
      const detail = document.createElement("div");
      detail.className = "set-note set-detail";
      detail.hidden = true;
      detail.textContent = o.detail;
      txt.appendChild(detail);
    }
    r.appendChild(txt);
    if (o.button) {
      const b = document.createElement("button");
      b.type = "button";
      b.className = o.kind === "see" ? "set-see" : "set-go";
      b.textContent = o.button;
      if (o.detail) {
        // Reveals text already on this page. Nothing is requested, nothing runs, and
        // so nothing here is ever disabled by a run in flight.
        b.dataset.detailToggle = "1";
        b.setAttribute("aria-expanded", "false");
      } else if (o.family === "harness") {
        b.dataset.harnessAction = o.action;
        b.disabled = !airlockHarnessActionArmed(o.action);
      } else {
        b.dataset.updAction = o.action;
        // Armed here, refused server-side: airlockUpdActionArmed decides which
        // actions this build can run at all, and applyRunState() decides whether
        // right now is a moment to run one.
        b.disabled = !airlockUpdActionArmed(o.action);
      }
      if (b.disabled) b.title = o.disabledWhy || "";
      r.appendChild(b);
    }
    return r;
  }

  // ── running one ────────────────────────────────────────────────────────
  //
  // The update reruns the installer, which reloads nginx and restarts dev-monitor.
  // THIS PAGE'S OWN CONNECTION therefore dies partway through a successful run, and
  // completion must never be judged from the response to the request that started it.
  // So: POST, then forget the response, and read a record on disk until it is
  // terminal. A dropped fetch is not a verdict — it keeps the last render, the same
  // discipline the snapshot poll uses.
  let runState = null;                        // last answer from .../updates/run
  let execError = "";                         // a refusal from .../updates/execute
  let runTimer = null;
  let runPollStarted = false;
  let harnessState = null;                    // last answer from .../harness/run
  let harnessError = "";                      // a refusal from .../harness/execute
  let harnessTimer = null;

  const EXEC_ERROR = {
    run_active: "이미 업데이트가 실행 중입니다.",
    updater_busy: "다른 Airlock 갱신 작업이 진행 중입니다 — 끝난 뒤 다시 시도하십시오.",
    app_not_pending: "이 앱은 지금 재설치 대상이 아닙니다 — 목록을 새로 고칩니다.",
    bad_app_id: "앱 이름을 알아보지 못했습니다.",
    bad_action: "알 수 없는 동작입니다.",
    state_unwritable: "실행 기록을 쓰지 못했습니다 — 상태 디렉터리를 확인하십시오.",
    launch_failed: "실행 창을 만들지 못했습니다 — 이 박스에 tmux 가 필요합니다.",
  };

  const HARNESS_ERROR = {
    run_active: "이미 갱신이 실행 중입니다.",
    bad_action: "알 수 없는 동작입니다.",
    state_unwritable: "실행 기록을 쓰지 못했습니다 — 상태 디렉터리를 확인하십시오.",
    launch_failed: "실행 창을 만들지 못했습니다 — 이 박스에 tmux 가 필요합니다.",
    // The detection timer is a separate install step, so its absence is a real state
    // of a working box rather than a fault to retry into.
    recheck_unavailable: "이 박스에는 자동 감지 타이머가 설치돼 있지 않습니다 — "
                       + "install/airlock-update-timer.sh 로 설치합니다.",
    recheck_timeout: "점검을 시작하지 못했습니다 — 잠시 뒤 다시 시도하십시오.",
  };

  function renderRun() {
    const line = airlockUpdRunLine(runState);
    runEl.textContent = "";
    runEl.classList.toggle("set-run-bad", !!line.bad || !!execError);
    const parts = [];
    if (execError) parts.push({ head: true, text: execError });
    if (line.text) parts.push({ head: true, text: line.text });
    if (line.detail) parts.push({ head: false, text: line.detail });
    if (line.recoveryNote) parts.push({ head: false, text: line.recoveryNote });
    for (const part of parts) {
      const el = document.createElement("div");
      if (part.head) el.className = "set-run-head";
      el.textContent = part.text;
      runEl.appendChild(el);
    }
    if (line.recovery) {
      const fix = document.createElement("code");
      fix.className = "set-run-fix";
      fix.textContent = line.recovery;
      runEl.appendChild(fix);
    }
    runEl.hidden = !runEl.children.length;
    applyRunState();
  }

  // Disabling is a second gate on top of the armed check: an armed action may still
  // be a bad idea right now (a run in flight, or somebody else's updater holding the
  // mutex). Buttons that were never armed stay disabled either way.
  //
  // The two families are gated SEPARATELY and on purpose. An `bin/airlock-update` in
  // flight says nothing about whether the Codex CLI can be upgraded — folding them
  // into one blocked flag would take away a button for a reason that is not true of
  // it, and the panel would be refusing on evidence it does not have.
  function applyRunState() {
    const blocked = airlockUpdRunLine(runState).blocked;
    for (const b of panel.querySelectorAll("button[data-upd-action]")) {
      b.disabled = !airlockUpdActionArmed(b.dataset.updAction) || blocked;
    }
    const harnessBlocked = airlockHarnessRunLine(harnessState).blocked;
    for (const b of panel.querySelectorAll("button[data-harness-action]")) {
      b.disabled = !airlockHarnessActionArmed(b.dataset.harnessAction) || harnessBlocked;
    }
  }

  // ── the harness run line ───────────────────────────────────────────────
  //
  // Its own poller, its own record, its own element. Nothing here restarts this
  // backend, so unlike the update poller it never has to survive its own connection
  // dying — but it keeps the same "a dropped fetch is not a verdict" discipline,
  // because a blanked line reads as "nothing happened" and something did.
  function renderHarnessRun() {
    const line = airlockHarnessRunLine(harnessState);
    harnessRunEl.textContent = "";
    harnessRunEl.classList.toggle("set-run-bad", !!line.bad || !!harnessError);
    const parts = [];
    if (harnessError) parts.push({ head: true, text: harnessError });
    if (line.text) parts.push({ head: true, text: line.text });
    if (line.detail) parts.push({ head: false, text: line.detail });
    for (const part of parts) {
      const el = document.createElement("div");
      if (part.head) el.className = "set-run-head";
      el.textContent = part.text;
      harnessRunEl.appendChild(el);
    }
    harnessRunEl.hidden = !harnessRunEl.children.length;
    applyRunState();
  }

  function scheduleHarness(ms) {
    if (harnessTimer) clearTimeout(harnessTimer);
    harnessTimer = setTimeout(pollHarness, ms);
  }

  async function pollHarness() {
    let r;
    try { r = await fetch("/monitor/api/owner/harness/run", { cache: "no-store" }); }
    catch (_) { scheduleHarness(15000); return; }
    if (r.status === 404) {                    // detection without harness execution
      harnessState = { enabled: false, run: null };
      renderHarnessRun();
      return;                                  // nothing left to poll for
    }
    if (!r.ok) { scheduleHarness(15000); return; }   // keep the last render
    let d; try { d = await r.json(); } catch (_) { scheduleHarness(15000); return; }
    if (!d || typeof d !== "object" || Array.isArray(d)) { scheduleHarness(15000); return; }
    harnessState = { enabled: true, run: d.run || null };
    if (d.run && (d.run.status === "starting" || d.run.status === "running")) harnessError = "";
    renderHarnessRun();
    scheduleHarness(airlockHarnessRunLine(harnessState).blocked ? 4000 : 60000);
  }

  function scheduleRun(ms) {
    if (runTimer) clearTimeout(runTimer);
    runTimer = setTimeout(pollRun, ms);
  }

  async function pollRun() {
    let r;
    try { r = await fetch("/monitor/api/owner/updates/run", { cache: "no-store" }); }
    catch (_) { scheduleRun(5000); return; }   // mid-update disconnect: try again soon
    if (r.status === 404) {                    // detection without execution
      runState = { enabled: false, busy: null, run: null };
      renderRun();
      return;                                  // nothing left to poll for
    }
    if (!r.ok) { scheduleRun(15000); return; } // keep the last render
    let d; try { d = await r.json(); } catch (_) { scheduleRun(15000); return; }
    if (!d || typeof d !== "object" || Array.isArray(d)) { scheduleRun(15000); return; }
    runState = { enabled: true, busy: d.busy, run: d.run || null };
    if (d.run && (d.run.status === "starting" || d.run.status === "running")) execError = "";
    renderRun();
    scheduleRun(airlockUpdRunLine(runState).blocked ? 4000 : 60000);
  }

  panel.addEventListener("click", async (e) => {
    const button = e.target.closest && e.target.closest("button[data-upd-action]");
    if (!button || button.disabled) return;
    const body = airlockUpdActionBody(button.dataset.updAction);
    if (!body) return;                         // drawn, but not ours to run
    execError = "";
    // Optimistic about "a run was asked for", never about its outcome. The record
    // replaces this on the next poll, one way or the other.
    runState = { enabled: true, busy: null,
                 run: { status: "starting", action: body.action,
                        appId: body.id || null } };
    renderRun();
    let r;
    try {
      r = await fetch("/monitor/api/owner/updates/execute", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(body),
      });
    } catch (_) {
      scheduleRun(1500);                       // the answer was lost, not the request
      return;
    }
    let j = null; try { j = await r.json(); } catch (_) {}
    if (!r.ok) {
      execError = EXEC_ERROR[j && j.error]
        || (r.status === 403 ? "권한이 확인되지 않았습니다."
            : "실행 요청이 거부됐습니다 (HTTP " + r.status + ").");
      runState = { enabled: r.status !== 404, busy: null, run: null };
      renderRun();
      scheduleRun(15000);
      return;
    }
    scheduleRun(1200);
  });

  // Reveals a line already on this page. Separate from the action handler below
  // because it is not an action: nothing is requested and nothing can refuse it.
  panel.addEventListener("click", (e) => {
    const button = e.target.closest && e.target.closest("button[data-detail-toggle]");
    if (!button) return;
    const detail = button.parentElement
      && button.parentElement.querySelector(".set-detail");
    if (!detail) return;
    detail.hidden = !detail.hidden;
    button.setAttribute("aria-expanded", String(!detail.hidden));
  });

  panel.addEventListener("click", async (e) => {
    const button = e.target.closest && e.target.closest("button[data-harness-action]");
    if (!button || button.disabled) return;
    const body = airlockHarnessBody(button.dataset.harnessAction);
    if (!body) return;                         // drawn, but not ours to run
    harnessError = "";
    if (body.action === "codex") {
      // Optimistic about "a run was asked for", never about its outcome — the record
      // replaces this on the next poll, one way or the other.
      harnessState = { enabled: true, run: { status: "starting", action: "codex" } };
      renderHarnessRun();
    }
    let r;
    try {
      r = await fetch("/monitor/api/owner/harness/execute", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(body),
      });
    } catch (_) {
      scheduleHarness(1500);                   // the answer was lost, not the request
      return;
    }
    let j = null; try { j = await r.json(); } catch (_) {}
    if (!r.ok) {
      harnessError = HARNESS_ERROR[j && j.error]
        || (r.status === 403 ? "권한이 확인되지 않았습니다."
            : "요청이 거부됐습니다 (HTTP " + r.status + ").");
      // A refused codex run leaves no record to poll; a refused recheck leaves the
      // last one standing. Neither may invent one.
      if (body.action === "codex") harnessState = { enabled: r.status !== 404, run: null };
      renderHarnessRun();
      scheduleHarness(15000);
      return;
    }
    if (body.action === "recheck") {
      // The collector is a systemd oneshot started with --no-block, so there is no run
      // record here and nothing to poll. What a person asked for is a fresher reading,
      // and the snapshot poll is what carries it — re-read on a short ladder rather
      // than making them wait out the five-minute tick.
      harnessError = "";
      harnessRunEl.textContent = "";
      const said = document.createElement("div");
      said.className = "set-run-head";
      said.textContent = "점검을 시작했습니다 — 끝나면 위의 '마지막 확인' 시각이 바뀝니다.";
      harnessRunEl.appendChild(said);
      harnessRunEl.hidden = false;
      for (const ms of [15000, 40000, 90000, 180000]) setTimeout(poll, ms);
      return;
    }
    scheduleHarness(1200);
  });

  function renderUpdates(d) {
    updEl.textContent = "";
    let rows = 0;
    if (d.platform && d.platform.available) {
      const changed = d.platform.changedCount;
      const bits = [];
      bits.push(changed != null ? "새 버전 — 파일 " + changed + "개 변경" : "새 버전 감지");
      if (d.platform.ref) bits.push(d.platform.ref);
      bits.push("업데이트 전 자동 백업");
      updEl.appendChild(row("Airlock 본체", bits.join(" · "),
        { button: "업데이트", kind: "go", action: "platform" }));
      rows += 1;
    }
    for (const a of airlockUpdateApps(d)) {
      // A built-in app is a one-click reinstall. An external package whose
      // source digest moved is NOT: the lock is a security gate, re-approving
      // it is a terminal procedure by owner decision (LOCK_UI_V1), and so this
      // row gets the amber chip and a review button and no filled button at all.
      if (a.action === "lock-mismatch") {
        updEl.appendChild(row(appLabel(a.id) + " 앱",
          "소스 변경 감지 — 외부 패키지: 승인 없이 바뀐 코드는 설치가 거부됩니다",
          { chip: "잠금 재승인 필요 · 터미널 절차",
            button: "변경 검토", kind: "see", action: "review:" + a.id,
            disabledWhy: "잠금 재승인은 터미널 절차입니다 (결정 LOCK_UI_V1)." }));
      } else {
        updEl.appendChild(row(appLabel(a.id) + " 앱",
          "소스 변경 감지 — 본체 업데이트 경로로 재설치합니다",
          { button: "업데이트", kind: "go", action: "app:" + a.id }));
      }
      rows += 1;
    }
    if (!rows) {
      const quiet = document.createElement("div");
      quiet.className = "set-quiet";
      quiet.textContent = "새 버전이 없습니다.";
      updEl.appendChild(quiet);
    }
    updN.hidden = !rows;
    updN.textContent = rows + "건";
    applyRunState();
  }

  // Four layers, in the order the confirmed mockup fixes: the CLI that updates
  // itself, the CLI that does not, the shared skills, the hooks.
  //
  // A layer the snapshot did not report draws NO row. An empty row would be a claim
  // ("nothing to see here") made out of a missing measurement, which is the shape of
  // failure this whole panel exists to stop.
  function renderHarness(d) {
    harnessEl.textContent = "";
    const h = d.harness || {};

    const claude = airlockClaudeLine(d);
    if (claude) {
      harnessEl.appendChild(row("Claude Code CLI", claude, { chip: "자동 — 표시만" }));
    }

    const codex = airlockCodexLine(d);
    if (codex) {
      harnessEl.appendChild(airlockCodexOutdated(d)
        ? row("Codex CLI", codex,
              { button: "업데이트", kind: "go", family: "harness", action: "harness:codex" })
        : row("Codex CLI", codex, {}));
    }

    const skills = airlockSkillsLine(d);
    if (skills) {
      const canon = h.skills && h.skills.canon;
      harnessEl.appendChild(row(
        "공통 스킬" + (canon && canon.name ? " (" + canon.name + ")" : ""),
        skills,
        { button: "지금 점검", kind: "see",
          family: "harness", action: "harness:recheck" }));
    }

    // Display only, by owner decision HARNESS_V1: drift is reported and the fix stays
    // a reviewed procedure. There is no armed action in this row and there is not
    // meant to be one — 자세히 only reveals the checker's own output.
    if (typeof h.hooksDrift === "boolean") {
      harnessEl.appendChild(h.hooksDrift
        ? row("훅", "정본과 다른 훅이 있습니다 — 반영은 사람 확인을 거칩니다",
              { chip: "/harness-provision 으로 반영",
                button: "자세히", kind: "see",
                detail: h.hooksDetail || "점검기가 이유를 남기지 않았습니다." })
        : row("훅", "정본과 같습니다", {}));
    }

    if (!harnessEl.children.length) {
      const quiet = document.createElement("div");
      quiet.className = "set-quiet";
      quiet.textContent = "하네스 상태를 아직 받지 못했습니다.";
      harnessEl.appendChild(quiet);
    }
    applyRunState();
  }

  // The dot and the badge read the same list, so the launcher and the sheet
  // cannot disagree about which app is waiting. Cleared every render: an app
  // that was updated elsewhere has to lose its dot without a page reload — and
  // so does every app when the API stops offering the feature at all, or the
  // launcher keeps showing update marks nobody can act on or explain.
  //
  // `wanted` is remembered because this runs in a different async block from
  // the tile render loop above and can win the race with it: the first poll can
  // land before /__airlock.json resolves, find no tiles, and mark nothing for
  // five minutes. The observer below re-applies the last answer to tiles as
  // they appear, so the dots do not depend on which fetch finished first.
  let wanted = new Set();
  function paintDots() {
    for (const tile of document.querySelectorAll(".app[data-app-name]")) {
      const has = tile.querySelector(":scope > .dot");
      if (wanted.has(tile.dataset.appName)) {
        if (!has) {
          const dot = document.createElement("span");
          dot.className = "dot";
          dot.title = "업데이트 있음";
          tile.appendChild(dot);
        }
      } else if (has) {
        has.remove();
      }
    }
  }
  function renderDots(d) { wanted = new Set(airlockUpdateAppIds(d)); paintDots(); }
  const secs = document.getElementById("secs");
  if (secs && window.MutationObserver) {
    new MutationObserver(paintDots).observe(secs, { childList: true, subtree: true });
  }

  // Spelled out because the badge is a single number over three different
  // things, and "why does it say 4" is otherwise unanswerable from this screen.
  function renderFoot(d, count) {
    const parts = [];
    if (d.platform && d.platform.available) parts.push("본체 1");
    const apps = airlockUpdateAppIds(d).length;
    if (apps) parts.push("앱 " + apps);
    if (airlockCodexOutdated(d)) parts.push("Codex CLI 1");
    footEl.textContent = count
      ? "배지 " + count + " = " + parts.join(" + ") + " · 구독 계정 관리는 헤더 신원 pill 로 들어갑니다"
      : "구독 계정 관리는 헤더 신원 pill 로 들어갑니다";
  }

  // Everything that reads the payload is computed BEFORE the first surface is
  // touched. A throw halfway through leaves a badge, a row list and a set of
  // dots that disagree with each other and with nothing on screen saying so —
  // so the reads go first and the writes go after, and there is no seam between
  // them for a bad payload to land in.
  function render(d) {
    const count = airlockUpdateCount(d);
    const checked =
      "업데이트 · 에이전트 · 하네스 — 본체 소유 · 마지막 확인 " + fmtChecked(d.checkedAt);
    gear.hidden = false;
    badge.hidden = count === 0;
    badge.textContent = String(count);
    gear.setAttribute("aria-label", count ? "Airlock 설정 — 업데이트 " + count + "건" : "Airlock 설정");
    checkedEl.textContent = checked;
    renderUpdates(d);
    renderHarness(d);
    renderDots(d);
    renderFoot(d, count);
  }

  // Identity is resolved inside the poll, not once before it. `j()` returns null
  // for a 500 and for a dropped connection exactly as it does for "not the
  // owner", so deciding once at load time means one bad moment on the network
  // costs the owner the gear until they reload. A DEFINITE answer settles it
  // both ways: role "owner" arms the poll, any other role stops it for good and
  // draws no further fetch; only "we could not ask" is retried.
  let owner = null;                             // null = still unknown
  async function identified() {
    if (owner !== null) return owner;
    let me = null;
    try { me = await j("/whoami"); } catch (_) {}
    if (!me) return null;                       // unknown — ask again next poll
    owner = me.role === "owner";
    return owner;
  }

  async function poll() {
    const isOwner = await identified();
    if (isOwner === false) { clearInterval(timer); return; }
    if (!isOwner) return;                       // identity unknown — retry next tick
    // Started from here, not at load: a collaborator (or an unresolved identity)
    // must not open a second polling loop that only ever collects 403s.
    if (!runPollStarted) { runPollStarted = true; pollRun(); pollHarness(); }
    let r;
    try { r = await fetch("/monitor/api/owner/updates", { cache: "no-store" }); }
    catch (_) { return; }                       // network failure — keep the last render
    if (r.status === 403 || r.status === 404) { // not offered here — no gear at all
      setOpen(false);
      gear.hidden = true;
      renderDots(null);                         // and no orphaned tile dots either
      return;
    }
    if (!r.ok) return;                          // unexpected status — keep the last render
    let d; try { d = await r.json(); } catch (_) { return; }
    // `null` and `[]` are valid JSON and a 200 can carry either. Rendering one
    // would blank the badge on its way to throwing at `d.checkedAt`, which is
    // the "keep the last render" rule failing in the exact shape it exists to
    // prevent — so a payload that is not an object is an unexpected payload.
    if (!d || typeof d !== "object" || Array.isArray(d)) return;
    render(d);
  }
  // Detection runs on a daily timer, so a 30s poll would be 2,880 requests to
  // watch a number that moves once. Five minutes is short enough that a manual
  // run of the timer shows up while you are still looking at the screen.
  const timer = setInterval(poll, 300000);
  poll();
})();
</script>

<script>
// Suggestion box: POST only {text} to the same-origin /feedback/api/ — the owner
// is attached server-side by the backend from the gate header (never sent here).
// The box stays hidden unless the backend reports it's configured, and even then
// only the small "Feedback" trigger shows until it is clicked.
(async () => {
  const sec = document.getElementById("feedback");
  const open = document.getElementById("fb-open");
  const panel = document.getElementById("fb-panel");
  const close = document.getElementById("fb-close");
  const ta = document.getElementById("fb-text");
  const btn = document.getElementById("fb-send");
  const status = document.getElementById("fb-status");
  if (!sec) return;

  let health = null;
  try {
    const r = await fetch("/feedback/api/health", { cache: "no-store" });
    if (r.ok) health = await r.json();
  } catch (_) { /* backend down -> box stays hidden */ }
  if (!health || !health.enabled) return;   // unconfigured -> no box (degrade cleanly)
  sec.hidden = false;

  // Disclosure: the trigger yields to the panel (one of the two is visible), so
  // the collapsed launcher shows a single small pill and nothing else.
  const setOpen = (on) => {
    panel.hidden = !on;
    open.hidden = on;
    open.setAttribute("aria-expanded", String(on));
    if (on) ta.focus();
    else { status.textContent = ""; open.focus(); }
  };
  open.addEventListener("click", () => setOpen(true));
  close.addEventListener("click", () => setOpen(false));
  // Esc always closes: the textarea keeps its value, so a draft survives being
  // collapsed and comes back on the next open.
  panel.addEventListener("keydown", (e) => {
    if (e.key === "Escape") { e.preventDefault(); setOpen(false); }
  });

  btn.addEventListener("click", async () => {
    const text = (ta.value || "").trim();
    if (!text) { status.textContent = "Enter a message."; return; }
    btn.disabled = true;
    status.textContent = "Sending…";
    try {
      const r = await fetch("/feedback/api/submit", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ text }),
      });
      let d = null; try { d = await r.json(); } catch (_) {}
      if (r.ok && d && d.ok) {
        ta.value = "";
        status.textContent = "";
        if (d.issue_url) {
          status.append("Sent · ");
          const a = document.createElement("a");
          a.href = d.issue_url; a.target = "_blank"; a.rel = "noopener";
          a.textContent = "open";
          status.append(a);
        } else {
          status.textContent = "Sent, thanks!";
        }
      } else {
        status.textContent = "Failed: " + ((d && d.error) || r.status);
      }
    } catch (e) {
      status.textContent = "Failed: " + e;
    } finally {
      btn.disabled = false;
    }
  });
})();
</script>
<script>
// Identity pill -> subscription accounts. The confirmed mockup (9) took the
// subscription row OUT of the settings sheet and put the entrance here instead:
// the pill is already the place that says whose box this is, so "my account"
// reads off it, and an expiring login becomes its ring rather than another badge
// competing with the gear's.
//
// What opens is the SAME panel devterm's own account icon and the return widget's
// menu open — hub/assets/accounts/panel.html, one implementation with three hosts.
// It is an iframe on devterm's origin and not a copy of the UI here, because every
// fetch inside it is a root-absolute path that only that gate answers. That is also
// why the gate aliases the file out of the webroot instead of the hub serving it
// from /assets/: moving the file would not have moved the API with it.
//
// Failure discipline, split on purpose — the two halves fail differently:
//   - becoming an entrance at all needs a definite yes: devterm installed with a
//     public port, a verified owner, and /acct-alert actually answering. Short of
//     that the pill stays the plain label it is today. An entrance that opens a
//     modal saying "could not load" is worse than no entrance.
//   - once it IS an entrance, a later failed poll clears the RING and keeps the
//     entrance. No reading is not a warning (the widget's rule, same endpoint), and
//     it is not a reason to take the way in away either.
(() => {
  const pill = document.querySelector("[data-account-entry]");
  if (!pill) return;

  // Where the account panel lives, from the launcher config the page already
  // fetches. devterm by name, deliberately: the account API is that gate's, which
  // is the same thing install/lib.sh's airlock_panel_url decides for the return
  // widget — two derivations of one fact, so they name the same app.
  //
  // The port key is webjson's public port, and the host is the FQDN the installer
  // measured, because a separate-port URL has to match the Tailscale cert — the
  // cert covers the FQDN only, so a short hostname would give the browser a link it
  // cannot verify. Pure (host passed in, nothing read off `location`) so that
  // install/test-hub-filter.sh can exercise it in node.
  function airlockAccountPanelBase(apps, fqdn, fallbackHost) {
    const devterm = apps && apps.devterm;
    const port = devterm && devterm.port;
    if (!port) return "";
    const host = (fqdn && fqdn.indexOf(".") > 0) ? fqdn : fallbackHost;
    if (!host) return "";
    return "https://" + host + ":" + port + "/";
  }

  let base = "", modal = null, level = "";

  function paintRing() {
    if (level === "warn" || level === "crit") pill.setAttribute("data-acct-level", level);
    else pill.removeAttribute("data-acct-level");
  }

  function closePanel() {
    if (!modal) return;
    modal.remove();
    modal = null;
    pill.focus();
  }

  function openPanel() {
    if (modal) { closePanel(); return; }
    const ov = document.createElement("div");
    ov.className = "acct-modal";
    const box = document.createElement("div");
    box.className = "acct-box";
    box.setAttribute("role", "dialog");
    box.setAttribute("aria-modal", "true");
    box.setAttribute("aria-label", "구독 계정 관리");
    const head = document.createElement("div");
    head.className = "acct-head";
    const ttl = document.createElement("span");
    ttl.className = "acct-ttl"; ttl.textContent = "구독 계정 관리";
    const x = document.createElement("button");
    x.type = "button"; x.className = "acct-x"; x.textContent = "\u2715";
    x.setAttribute("aria-label", "닫기");
    x.addEventListener("click", closePanel);
    head.append(ttl, x);
    // embed=1 tells the panel the host owns the header, so it drops its own.
    const frame = document.createElement("iframe");
    frame.className = "acct-frame";
    frame.src = base + "panel.html?p=accounts&embed=1";
    frame.title = "구독 계정 관리";
    const note = document.createElement("div");
    note.className = "acct-note";
    note.hidden = true;
    box.append(head, frame, note);
    ov.appendChild(box);
    ov.addEventListener("click", (e) => { if (e.target === ov) closePanel(); });
    document.body.appendChild(ov);
    modal = ov;
    x.focus();
    // A blank rectangle is not an error message: if the panel never loads, say so
    // and show the address that was tried (the widget's rule, same wording problem).
    let loaded = false;
    frame.addEventListener("load", () => { loaded = true; });
    setTimeout(() => {
      if (loaded || modal !== ov) return;
      frame.hidden = true;
      note.hidden = false;
      note.textContent = "구독 계정 패널이 6초 안에 열리지 않았습니다: " + frame.src +
        " — devterm 이 이 주소에서 응답하는지 확인해 주십시오.";
    }, 6000);
  }

  document.addEventListener("keydown", (e) => { if (e.key === "Escape") closePanel(); });
  // The panel cannot close the modal that contains it, so it asks us to. Only the
  // panel's own origin may ask: this listener is on the hub, which any framed page
  // could post to, and the current spelling is the only one accepted — the legacy
  // one is due for deletion (docs/tasks/active/frontend-namespace-overlap-end.md)
  // and a new listener must not be a fresh reason to keep it alive.
  window.addEventListener("message", (e) => {
    if (!base || e.data !== "airlock-panel-close") return;
    let want; try { want = new URL(base).origin; } catch (_) { return; }
    if (e.origin === want) closePanel();
  });

  function arm() {
    if (pill.hasAttribute("data-acct")) return;
    pill.setAttribute("data-acct", "");
    pill.setAttribute("role", "button");
    pill.setAttribute("tabindex", "0");
    pill.setAttribute("aria-haspopup", "dialog");
    pill.setAttribute("title", "구독 계정 관리");
    pill.addEventListener("click", openPanel);
    pill.addEventListener("keydown", (e) => {
      if (e.key === "Enter" || e.key === " ") { e.preventDefault(); openPanel(); }
    });
  }

  async function poll() {
    let r;
    try { r = await fetch(base + "acct-alert", { cache: "no-store" }); }
    catch (_) { level = ""; paintRing(); return; }   // no reading is not a warning
    if (!r.ok) { level = ""; paintRing(); return; }
    let a; try { a = await r.json(); } catch (_) { level = ""; paintRing(); return; }
    arm();                                            // it answered: there is a panel
    level = (a && (a.level === "warn" || a.level === "crit")) ? a.level : "";
    paintRing();
  }

  (async () => {
    const [cfg, me] = [await j("/__airlock.json"), await j("/whoami")];
    if (!me || me.role !== "owner") return;           // collaborators draw no fetch
    base = airlockAccountPanelBase(cfg && cfg.apps, cfg && cfg.fqdn, location.hostname);
    if (!base) return;                                // no devterm on this box
    poll();
    setInterval(poll, 30000);
  })();
})();
</script>
