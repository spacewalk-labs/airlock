<!doctype html>
<html lang="en" data-theme="system">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Airlock</title>
<script>
/* Match the live launcher's persisted choice before the page or browser chrome paints. */
(function () {
  var theme = "system";
  try {
    var stored = localStorage.getItem("markwand-theme");
    if (stored === "light" || stored === "dark" || stored === "system") {
      theme = stored;
    }
  } catch (_) {}
  document.documentElement.setAttribute("data-theme", theme);
  var light = theme === "light" ||
    (theme === "system" && window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches);
  var themeColor = document.createElement("meta");
  themeColor.name = "theme-color";
  themeColor.content = light ? "#f5f5f7" : "#0a0f1e";
  document.head.appendChild(themeColor);
})();
</script>
<link rel="stylesheet" href="/assets/airlock-tokens.css">
<link rel="icon" type="image/png" href="/assets/favicon.png">
<link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Airlock">
<style>
  /* Colour, type, spacing and radius all come from /assets/airlock-tokens.css.
     There is no light/dark block here any more: the token sheet ships dark as
     canonical and overrides it for light, so this file never states a value and
     cannot drift from the rest of the system. */
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--airlock-canvas); color: var(--airlock-ink);
    font: 17px/1.5 -apple-system, "Segoe UI", Roboto, "Noto Sans KR", sans-serif;
    -webkit-font-smoothing: antialiased;
    padding: max(env(safe-area-inset-top), 1.5rem) 1.25rem 3rem;
  }
  header { max-width: 880px; margin: 0 auto 2rem; display: flex; align-items: center; gap: 1rem;
           flex-wrap: wrap; position: relative;   /* anchors the settings sheet */
           padding-bottom: 0.9rem; border-bottom: 1px solid var(--airlock-hairline); }
  h1 { font-size: 1.25rem; margin: 0; letter-spacing: -0.02em; font-weight: 700; }
  .theme-group { margin-left: auto; display: flex; align-items: center; gap: 4px; }
  .theme-group button {
    min-height: 44px; padding: 5px 10px; border: 1px solid var(--airlock-hairline);
    border-radius: 999px; background: transparent; color: var(--airlock-mute);
    font: inherit; font-size: 0.75rem; font-weight: 600; cursor: pointer;
  }
  .theme-group button:hover { color: var(--airlock-ink); background: var(--airlock-surface-1); }
  .theme-group button:focus-visible { outline: none; box-shadow: var(--airlock-focus); }
  .theme-group button[aria-pressed="true"] {
    border-color: var(--airlock-primary); background: var(--airlock-primary);
    color: var(--airlock-on-primary);
  }
  .who { color: var(--airlock-mute); font-size: 0.9rem; font-weight: 500;
         padding: 4px 12px; border: 1px solid var(--airlock-hairline); border-radius: 999px; white-space: nowrap; }
  .who:empty { display: none; }
  /* The pill is the entrance to subscription accounts (owner decision, confirmed
     mockup 9: the settings sheet has no subscription row — this does, because the
     pill is already the place that says whose box this is). [data-acct] is set by
     script only once there is a panel to open, so an unwired pill keeps exactly
     the plain-label look it has today. */
  .who[data-acct] { cursor: pointer; color: var(--airlock-ink); }
  .who[data-acct]:hover { background: var(--airlock-surface-1); }
  .who[data-acct]:focus-visible { outline: none; box-shadow: var(--airlock-focus); }
  /* Warning ring. The level comes from devterm's /acct-alert — the same verdict
     devterm's own account icon and the return widget's ring read, so all three
     change colour at the same instant and no threshold is restated here. Amber
     warns; red blinks, because a static ring on something you have learnt to
     ignore has stopped being a warning. */
  .who[data-acct-level="warn"] { border-color: var(--airlock-warning); color: var(--airlock-warning); }
  .who[data-acct-level="crit"] { border-color: var(--airlock-danger); color: var(--airlock-danger);
                                 animation: acct-ring-blink 1.4s steps(1, end) infinite; }
  @keyframes acct-ring-blink { 50% { border-color: var(--airlock-hairline); } }
  @media (prefers-reduced-motion: reduce) {
    .who[data-acct-level="crit"] { animation: none; }
  }

  /* Subscription panel, opened from the pill. The panel is the platform asset at
     hub/assets/accounts/ — the same file devterm's account icon and the return
     widget's menu open, so there is one implementation with three hosts. It has to
     be an iframe on devterm's origin rather than a copy here: every fetch inside it
     is a root-absolute path that only that gate answers. This is just the modal
     around it, in the hub's own tokens. */
  .acct-modal { position: fixed; inset: 0; z-index: 60; display: flex;
                align-items: center; justify-content: center;
                padding: var(--airlock-sp-4); background: rgba(0, 0, 0, .6); }
  .acct-box { display: flex; flex-direction: column; overflow: hidden;
              width: min(460px, 100%); height: min(620px, 92vh);
              border: 1px solid var(--airlock-hairline); border-radius: var(--airlock-r-lg);
              background: var(--airlock-surface-1); box-shadow: var(--airlock-shadow-hover); }
  .acct-head { flex: 0 0 auto; display: flex; align-items: center; gap: var(--airlock-sp-3);
               padding: var(--airlock-sp-3) var(--airlock-sp-4);
               border-bottom: 1px solid var(--airlock-hairline);
               font-size: 0.95rem; font-weight: var(--airlock-fw-semibold); }
  .acct-ttl { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .acct-x { flex: none; width: 34px; height: 30px; border: 0; cursor: pointer;
            border-radius: var(--airlock-r-sm); background: var(--airlock-surface-2);
            color: var(--airlock-ink); font: inherit; font-size: 1rem; line-height: 1; }
  .acct-x:focus-visible { outline: none; box-shadow: var(--airlock-focus); }
  .acct-frame { flex: 1 1 auto; width: 100%; border: 0; background: var(--airlock-surface-1); }
  .acct-note { padding: var(--airlock-sp-4); color: var(--airlock-body);
               font-size: 0.85rem; line-height: 1.55; word-break: break-word; }
  main { max-width: 880px; margin: 0 auto; }
  .sec-h { font-size: 0.8rem; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase;
           color: var(--airlock-mute); margin: 0 0 1.25rem; display: flex; align-items: center; gap: 8px; }
  .sec-h::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--airlock-primary); }
  /* Sections after the first are separated by space, not by a rule: the grid
     already reads as blocks, and a divider per group turns a launcher into a
     form. The heading keeps its own bottom margin, so this is top-only. */
  .sec + .sec { margin-top: 2.5rem; }
  /* The gate note rides UNDER the heading it qualifies and above the tiles it
     describes, sized down from the heading — it is a caveat about where these
     tiles send you, not a second heading competing with the first. Sits at the
     heading's text, past the dot, so the two lines read as one block. */
  .sec-note { margin: -0.85rem 0 1.25rem 14px; color: var(--airlock-mute);
              font-size: 0.78rem; line-height: 1.45; max-width: 46ch; }

  /* launcher grid — category-coloured tiles + shared glyph sprite */
  .apps { display: grid; grid-template-columns: repeat(auto-fill, minmax(92px, 1fr));
          gap: 26px 12px; justify-items: center; }
  .app { display: flex; flex-direction: column; align-items: center; gap: 10px; width: 82px;
         text-decoration: none; color: var(--airlock-ink); position: relative; }
  .app[hidden] { display: none; }
  .app .ic {
    width: 60px; height: 60px; border-radius: 15px; display: grid; place-items: center;
    overflow: hidden; position: relative;
    color: var(--app-glyph, var(--airlock-primary));
    background: var(--app-tile, var(--airlock-surface-2));
    box-shadow: var(--airlock-shadow);
    transition: transform .16s cubic-bezier(.2,.8,.2,1), box-shadow .16s;
  }
  /* iOS-style glass edge: bright top-left / soft bottom-right corner rims */
  .app .ic::after {
    content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none;
    background:
      radial-gradient(145% 145% at 0% 0%, rgba(255,255,255,.32), rgba(255,255,255,0) 20%),
      radial-gradient(145% 145% at 100% 100%, rgba(255,255,255,.18), rgba(255,255,255,0) 22%),
      linear-gradient(180deg, rgba(255,255,255,.05) 0%, rgba(255,255,255,0) 48%, rgba(0,0,0,.05) 100%);
  }
  .app:hover .ic { transform: translateY(-3px); box-shadow: var(--airlock-shadow-hover); }
  .app .ic svg { width: 36px; height: 36px; display: block; }
  .app .ic svg, .app .ic svg * { color: var(--app-glyph, var(--airlock-primary)); }
  /* real brand icon (orca, paseo): full-bleed image, no category tile behind it */
  .app .ic img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .app.has-brand .ic { background: none; box-shadow: var(--airlock-shadow); }
  .app .lb { font-size: 0.85rem; font-weight: 500; text-align: center; line-height: 1.25; }
  /* The manifest description remains in each tile's DOM, but an iPhone-style
     home screen leads with the icon and name alone. Setting the root attribute
     to `data-tile-descriptions="visible"` is the single opt-in for a future
     preference or long-press reveal. */
  .app .sub { display: none; color: var(--airlock-mute); font-size: 0.72rem;
              text-align: center; line-height: 1.35; }
  :root[data-tile-descriptions="visible"] .app .sub { display: block; max-width: 18ch; }
  .app .origin { color: var(--airlock-mute); font-size: 0.68rem; font-weight: 600;
                 line-height: 1; padding: 3px 7px; border: 1px solid var(--airlock-hairline);
                 border-radius: 999px; white-space: nowrap; }

  /* Keep the home-screen density on phones: three icons, not two explanatory
     cards. The 82px tile is still wider and taller than the 44px touch target. */
  @media (hover: none), (pointer: coarse), (max-width: 560px) {
    .apps { grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 26px 12px; align-items: start; }
    .app { width: 100%; }
  }

  /* Tile colour is the app's, not the system's.
     Every other colour on this page is a token, and this block is the one
     deliberate exception. It follows the iOS rule rather than ours: the system
     owns the geometry — the squircle, the 60px, the shadow, the glass edge —
     and the app owns its hue. A launcher whose tiles are all one colour is
     tidier and worse; you find an app on a home screen by its colour before
     you have read a single label.
     So these are raw hex on purpose. They are DATA about each tool, not part
     of the palette, and folding them into --airlock-* would make the design
     system claim authorship of a decision it does not own. Today the value is
     keyed off data-cat; per-app colour in airlock-app.toml is the next step,
     and this rule is the fallback for an app that does not declare one.
     coding=dark+green · docs=blue · files=teal · system=slate · comms=green */
  .app[data-cat="coding"] { --app-tile: #16181f; --app-glyph: #6aac32; }
  .app[data-cat="docs"]   { --app-tile: #2f5aa8; --app-glyph: #ffffff; }
  .app[data-cat="files"]  { --app-tile: #128a86; --app-glyph: #ffffff; }
  .app[data-cat="system"] { --app-tile: #46597e; --app-glyph: #ffffff; }
  .app[data-cat="comms"]  { --app-tile: #3f9a5c; --app-glyph: #ffffff; }

  .find-open, .find-close {
    width: 44px; height: 44px; padding: 0; display: grid; place-items: center;
    border: 1px solid var(--airlock-hairline); border-radius: 999px;
    background: transparent; color: var(--airlock-mute); cursor: pointer;
  }
  .find-open { margin-left: auto; }
  .find-open:hover, .find-close:hover { color: var(--airlock-ink); background: var(--airlock-surface-1); }
  .find-open:focus-visible, .find-close:focus-visible { outline: none; box-shadow: var(--airlock-focus); }
  .find-open svg, .find-close svg { width: 18px; height: 18px; fill: none; stroke: currentColor;
                                     stroke-width: 1.8; stroke-linecap: round; }
  .launcher-find { margin: 0 0 2rem; display: flex; align-items: center; gap: 8px; }
  .launcher-find[hidden] { display: none; }
  .launcher-find input {
    width: min(100%, 28rem); flex: 1; min-height: 44px; padding: 9px 14px;
    border: 1px solid var(--airlock-hairline); border-radius: 12px;
    background: var(--airlock-surface-1); color: var(--airlock-ink);
    font: inherit; font-size: 0.95rem; -webkit-appearance: none;
  }
  .launcher-find input:focus { outline: none; border-color: var(--airlock-primary); }
  .empty { color: var(--airlock-mute); }

  /* message strip — dev-monitor's "needs a person" preview, above the tool grid.
     Owner-only (matches the API's own gate); hidden entirely for anyone else, same as
     the feedback box below is hidden when its backend is off. */
  .msgstrip { max-width: 880px; margin: 0 auto 1.75rem; }
  .msgstrip[hidden] { display: none; }
  .ms-quiet { display: flex; align-items: center; gap: 10px; font-size: 0.85rem; color: var(--airlock-mute); }
  .ms-quiet .ok { color: var(--airlock-ink); font-weight: 500; }
  .ms-card { border: 1px solid var(--airlock-hairline); border-radius: 14px; background: var(--airlock-surface-1);
             padding: 0.9rem 1.1rem 0.3rem; }
  .ms-hd { display: flex; align-items: baseline; gap: 10px; margin-bottom: 0.4rem; }
  .ms-hd .ms-ttl { font-weight: 700; font-size: 0.95rem; }
  .ms-hd .ms-cnt { color: var(--airlock-mute); font-size: 0.85rem; }
  .ms-hd .ms-cnt b { color: var(--airlock-ink); }
  .ms-hd a { margin-left: auto; color: var(--airlock-primary); font-size: 0.82rem; text-decoration: none; }
  .ms-row { display: flex; align-items: baseline; gap: 8px; padding: 7px 0;
            border-top: 1px solid var(--airlock-hairline); text-decoration: none; color: inherit; }
  .ms-row:first-of-type { border-top: 0; }
  .ms-row .ms-t { font-size: 0.88rem; font-weight: 500; flex: 1; min-width: 0;
                  overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ms-row .ms-s { color: var(--airlock-mute); font-size: 0.76rem; white-space: nowrap; }

  /* ── settings: one gear, one number, one sheet ─────────────────────────
     The macOS convention rather than ours: the gear IS the update surface and
     the badge is the only thing that appears when something is waiting. A
     second "updates" icon would make the header say twice what one number
     says once. Owner-only, and gated on the very API that fills it — a box
     with detection switched off draws no gear at all rather than an empty
     panel (same 403/404 discipline as the message strip above). */
  .gear {
    position: relative; width: 44px; height: 44px; padding: 0; display: grid; place-items: center;
    border: 1px solid var(--airlock-hairline); border-radius: var(--airlock-r-pill);
    background: transparent; color: var(--airlock-mute); cursor: pointer;
  }
  .gear[hidden] { display: none; }
  .gear:hover { color: var(--airlock-ink); background: var(--airlock-surface-1); }
  .gear:focus-visible { outline: none; box-shadow: var(--airlock-focus); }
  .gear[aria-expanded="true"] { color: var(--airlock-ink); border-color: var(--airlock-primary); }
  .gear svg { width: 20px; height: 20px; display: block; fill: none; stroke: currentColor;
              stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
  /* Hidden at zero rather than drawn as "0": a zero is a number a reader stops
     to parse, and no badge is the fastest way to say there is nothing to do. */
  .gear-badge {
    position: absolute; top: 0; right: 0; min-width: 18px; height: 18px; padding: 0 5px;
    display: grid; place-items: center; border-radius: var(--airlock-r-pill);
    background: var(--airlock-primary); color: var(--airlock-on-primary);
    font-size: 0.68rem; font-weight: var(--airlock-fw-bold); line-height: 1;
  }
  .gear-badge[hidden] { display: none; }

  .settings {
    position: absolute; top: calc(100% + 8px); right: 0; z-index: 20;
    width: min(480px, calc(100vw - 2.5rem)); max-height: min(78vh, 780px); overflow-y: auto;
    padding: var(--airlock-sp-5); border: 1px solid var(--airlock-hairline);
    border-radius: var(--airlock-r-lg); background: var(--airlock-surface-1);
    box-shadow: var(--airlock-shadow-hover);
  }
  .settings[hidden] { display: none; }
  .set-ttl { font-size: var(--airlock-fs-lg); font-weight: var(--airlock-fw-bold);
             letter-spacing: var(--airlock-track); }
  .set-sub { color: var(--airlock-mute); font-size: 0.82rem; margin-top: 2px; }
  .set-sec { margin-top: var(--airlock-sp-6); }
  .set-h { display: flex; align-items: center; gap: var(--airlock-sp-2);
           font-size: 0.82rem; font-weight: var(--airlock-fw-semibold); color: var(--airlock-body);
           padding-bottom: var(--airlock-sp-2); border-bottom: 1px solid var(--airlock-hairline); }
  .set-n { padding: 2px 8px; border-radius: var(--airlock-r-pill);
           background: var(--airlock-surface-2); color: var(--airlock-ink);
           font-size: 0.72rem; font-weight: var(--airlock-fw-semibold); }
  .set-row { display: flex; align-items: flex-start; gap: var(--airlock-sp-4);
             padding: var(--airlock-sp-4) 0; border-bottom: 1px solid var(--airlock-hairline); }
  .set-row:last-child { border-bottom: 0; }
  .set-txt { flex: 1; min-width: 0; }
  .set-name { font-size: 0.95rem; font-weight: var(--airlock-fw-semibold); }
  .set-note { color: var(--airlock-mute); font-size: 0.82rem; line-height: 1.45; margin-top: 3px; }
  .set-quiet { color: var(--airlock-mute); font-size: 0.85rem; padding: var(--airlock-sp-4) 0; }
  .set-foot { color: var(--airlock-mute); font-size: 0.76rem; line-height: 1.5;
              margin: var(--airlock-sp-5) 0 0; padding-top: var(--airlock-sp-4);
              border-top: 1px solid var(--airlock-hairline); }

  /* Button grammar, fixed by the confirmed mockup and worth stating once:
     a FILLED button runs something in one click; an OUTLINED button only shows
     you something; a YELLOW CHIP means a person has to decide, and the row
     deliberately carries no filled button beside it. An external package whose
     source digest moved is the whole reason the third case exists. */
  .set-go, .set-see {
    flex: none; min-height: 34px; padding: 0 var(--airlock-sp-4);
    border-radius: var(--airlock-r-pill); font: inherit; font-size: 0.82rem;
    font-weight: var(--airlock-fw-semibold); cursor: pointer;
  }
  .set-go  { border: 0; background: var(--airlock-primary); color: var(--airlock-on-primary); }
  .set-see { border: 1px solid var(--airlock-hairline); background: transparent; color: var(--airlock-ink); }
  .set-go:focus-visible, .set-see:focus-visible { outline: none; box-shadow: var(--airlock-focus); }
  .set-go:disabled, .set-see:disabled { opacity: .55; cursor: default; }
  .set-chip { display: inline-block; margin-top: var(--airlock-sp-2); padding: 3px 9px;
              border: 1px solid var(--airlock-warning); border-radius: var(--airlock-r-pill);
              color: var(--airlock-warning); font-size: 0.74rem;
              font-weight: var(--airlock-fw-medium); }
  /* The run line. It is inside the updates section rather than beside the
     buttons because the panel's own connection can die mid-update (the installer
     reloads nginx and restarts dev-monitor), so this reads a record on disk and
     not a live request — see the poller. */
  .set-run { margin-top: var(--airlock-sp-3); font-size: 0.82rem;
             line-height: var(--airlock-lh); color: var(--airlock-mute); }
  .set-run[hidden] { display: none; }
  /* A revealed detail line: the checker's own output, indented under its row. */
  .set-detail { margin-top: var(--airlock-sp-2); overflow-wrap: anywhere; }
  .set-detail[hidden] { display: none; }
  .set-run-head { color: var(--airlock-ink); font-weight: var(--airlock-fw-medium); }
  .set-run-bad .set-run-head { color: var(--airlock-danger); }
  .set-run-fix { display: block; margin-top: var(--airlock-sp-2);
                 padding: var(--airlock-sp-2) var(--airlock-sp-3);
                 border: 1px solid var(--airlock-hairline);
                 border-radius: var(--airlock-r-sm);
                 background: var(--airlock-surface-2);
                 font-family: var(--airlock-font-mono); font-size: 0.76rem;
                 color: var(--airlock-ink); overflow-wrap: anywhere;
                 user-select: all; -webkit-user-select: all; }
  .set-opts { display: flex; flex-wrap: wrap; align-items: center;
              gap: var(--airlock-sp-2) var(--airlock-sp-5); margin-top: var(--airlock-sp-3); }
  .set-opts label { display: inline-flex; align-items: center; gap: var(--airlock-sp-2);
                    font-size: 0.88rem; }
  .set-opts input { accent-color: var(--airlock-primary); width: 16px; height: 16px; margin: 0; }
  .set-opts input:disabled + span { color: var(--airlock-mute); }

  /* The sheet is a dropdown on a desktop and a sheet on a phone: at 480px the
     header is narrower than the panel wants to be, so it stops being anchored
     to the gear and spans the screen instead. */
  @media (max-width: 560px) {
    .settings { position: fixed; top: auto; right: 0; left: 0; bottom: 0;
                width: 100%; max-height: 82vh;
                border-radius: var(--airlock-r-lg) var(--airlock-r-lg) 0 0;
                padding-bottom: max(env(safe-area-inset-bottom), var(--airlock-sp-5)); }
  }

  /* A tile whose app has an update carries the same dot the gear badge counts,
     so the launcher answers "which one?" without opening the panel. Hung off
     .app (already position: relative) and not off .app .ic, whose width and
     radius bin/gen-app-icons.py reads out of this file expecting exactly one
     declaration each — and which clips its children anyway (overflow: hidden).
     Centred-relative, so it lands on the icon's corner in both the 82px
     desktop tile and the full-width phone column. */
  .app .dot {
    position: absolute; top: -3px; left: calc(50% + 19px); width: 12px; height: 12px;
    border-radius: 50%; background: var(--airlock-primary);
    box-shadow: 0 0 0 2px var(--airlock-canvas);
  }

  /* suggestion box — a same-origin feedback relay (see apps/feedback).
     Collapsed by default: the launcher stays quiet and only a small trigger
     shows. The panel below is revealed on click. */
  .feedback { max-width: 880px; margin: 2.75rem auto 0; }
  .fb-open {
    border: 1px solid var(--airlock-hairline); border-radius: 999px; padding: 5px 14px; cursor: pointer;
    background: transparent; color: var(--airlock-mute); font: inherit; font-size: 0.8rem; font-weight: 500;
    transition: color .15s, border-color .15s, background .15s;
  }
  .fb-open:hover { color: var(--airlock-ink); border-color: var(--airlock-mute); background: var(--airlock-surface-1); }
  .fb-panel { position: relative; }        /* anchors the dismiss button */
  .fb-panel[hidden] { display: none; }
  .fb-panel .sec-h { margin-bottom: 0.75rem; padding-right: 2.75rem; }
  .feedback textarea {
    width: 100%; min-height: 84px; resize: vertical; box-sizing: border-box;
    padding: 12px 14px; border: 1px solid var(--airlock-hairline); border-radius: 12px;
    background: var(--airlock-surface-1); color: var(--airlock-ink); font: inherit;
    -webkit-appearance: none;   /* iOS draws an inset shadow otherwise */
  }
  .feedback textarea:focus { outline: none; border-color: var(--airlock-primary); }
  .fb-row { display: flex; align-items: center; gap: 12px; margin-top: 10px; }
  /* Sized against the section headers, not the 17px body text: this is a small
     utility control at the foot of the page, not a page-level call to action. */
  .fb-send {
    border: 0; border-radius: 999px; padding: 5px 14px; cursor: pointer;
    background: var(--airlock-primary); color: #fff; font: inherit; font-size: 0.8rem; font-weight: 600;
  }
  .fb-send:disabled { opacity: .55; cursor: default; }
  /* Dismiss sits at the panel's top-right, away from Send: it is an escape
     hatch, not a sibling of the primary action. Icon-only, but a 36px target. */
  .fb-close {
    position: absolute; top: -7px; right: 0; width: 36px; height: 36px; padding: 0;
    display: grid; place-items: center; border: 0; border-radius: 999px;
    background: none; color: var(--airlock-mute); cursor: pointer;
    transition: color .15s, background .15s;
  }
  .fb-close:hover { color: var(--airlock-ink); background: var(--airlock-surface-1); }
  .fb-close svg { width: 15px; height: 15px; display: block;
                  fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: round; }
  .fb-status { min-width: 0; color: var(--airlock-mute); font-size: 0.8rem; }
  .fb-status a { color: var(--airlock-primary); }

  footer { max-width: 880px; margin: 2.5rem auto 0; color: var(--airlock-mute); font-size: 0.8rem; }
</style>
